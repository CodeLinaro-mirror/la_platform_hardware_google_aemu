# Address Gerrit Review Comments Workflow (YAML)
# Automates fetching Gerrit review comments, applying fixes, verifying tests,
# amending the commit while preserving Change-Id, uploading a new patchset,
# resolving threads on Gerrit, and looping if new comments arrive.

name: address-review
description: Fetch Gerrit review comments, apply fixes, run tests, amend commit, upload patchset, resolve threads, and loop on follow-up feedback.

args:
  - name: cl
    required: false
    default: "HEAD"
    help: "Gerrit CL number, Change-Id, URL, or HEAD (default: HEAD)"
  - name: all-open
    required: false
    default: "false"
    help: "Batch-process all open CLs owned by self with unresolved comments (true/false)"
  - name: repo
    required: false
    default: "."
    help: "Local Git workspace root (default: .)"
  - name: test-cmd
    required: false
    default: ""
    help: "Optional verification command to run in Step 0 before amending (e.g. bazel test ... or mise fasttest)"
  - name: checkout
    required: false
    default: "true"
    help: "Automatically fetch/checkout the target CL revision (default: true)"
  - name: skip-upload
    required: false
    default: "false"
    help: "Skip repo upload in Step 2 (default: false)"
  - name: wait-timeout
    required: false
    default: "120"
    help: "Seconds to poll Gerrit for follow-up feedback after uploading (0 to disable)"
  - name: poll-interval
    required: false
    default: "15"
    help: "Seconds between Gerrit poll requests (default: 15)"
  - name: wait-for-approval
    required: false
    default: "false"
    help: "Continue polling until Code-Review+2 is granted (default: false)"

init:
  queue-file: "{cache-dir}/queue_{state_id}.json"
  dossier-file: "{cache-dir}/dossier_{state_id}.md"
  primary-repo:
    cmd: "python3 {workflow_dir}/prepare_review_batch.py --cl \"{cl}\" --all-open \"{all_open}\" --queue-file \"{queue-file}\" --dossier-file \"{dossier-file}\" --workspace-root \"{repo}\" --checkout \"{checkout}\""

steps:
  - step: 0
    title: Address Review Comments, Stage Replies, and Run Tests
    prompt: |
      Read the Gerrit review dossier at `{dossier-file}` (and queue state at `{queue-file}`).
      Target repository: `{primary-repo}` (Review Round Iteration: `{iteration}`).

      For EVERY unresolved comment thread listed in `{dossier-file}`:
      1. Inspect the referenced file and line numbers in `{primary-repo}` and implement the requested code or test changes.
      2. Stage a concise reply explaining how the feedback was addressed using the exact command shown in `{dossier-file}`:
         `emu-dev-cli gerrit reply <cl_number> --comment-id "<leaf_id>" --message "Done: <explanation>" --resolve --queue-file "{queue-file}" --stage-only`
      3. Run the relevant unit tests for the modified components inside `{primary-repo}` to verify your changes locally before advancing.
    verifier_cmd: "python3 {workflow_dir}/verify_fixes.py --queue-file \"{queue-file}\" --test-cmd \"{test-cmd}\""
    error_prompt: |
      Review fix verification failed (attempt {retries} of {max_retries}):
      {verifier_error}

      Ensure every unresolved comment in `{dossier-file}` has a staged reply in `{queue-file}` and that `{test-cmd}` passes in `{primary-repo}`.
    stuck_prompt: |
      Review fix verification failed after {max_retries} attempts:
      {verifier_error}
    stuck_reason: "Review fix verification failed after {retries} attempts: {verifier_error}"
    max_retries: 4

  - step: 1
    title: Amend Commit Message & Preserve Change-Id
    workflow: amend-commit
    args:
      repo: "{primary-repo}"

  - step: 2
    title: Upload New Patchset, Resolve Threads, and Poll for Follow-Up Feedback
    prompt: |
      All code changes and the amended commit in `{primary-repo}` are verified!
      Advance this step to automatically:
      - Upload the new patchset via `repo upload` (`Presubmit-Ready+1`)
      - Publish all staged replies from `{queue-file}` and mark threads Resolved on Gerrit
      - Poll Gerrit (up to `{wait-timeout}` seconds) for any new follow-up comments from reviewers or `groupagent-android-review`.
    verifier_cmd: "python3 {workflow_dir}/verify_upload_and_resolve.py --queue-file \"{queue-file}\" --dossier-file \"{dossier-file}\" --skip-upload \"{skip-upload}\" --wait-timeout \"{wait-timeout}\" --poll-interval \"{poll-interval}\" --wait-for-approval \"{wait-for-approval}\""
    loop_to_step: 0
    loop_exit_code: 2
    max_iterations: 5
    loop_prompt: |
      New unresolved review comments arrived on Gerrit after uploading the patchset!
      The review dossier at `{dossier-file}` and queue at `{queue-file}` have been refreshed.
      Looping back to Step 0 (iteration {iteration}) to address the new feedback.
    error_prompt: |
      Upload and comment resolution failed (attempt {retries} of {max_retries}):
      {verifier_error}

      Ensure `{primary-repo}` has a clean working tree (all changes amended into HEAD) and retry.
    stuck_prompt: |
      Upload and comment resolution failed after {max_retries} attempts:
      {verifier_error}
    stuck_reason: "Upload and comment resolution failed after {retries} attempts: {verifier_error}"
    max_retries: 3

  - step: 3
    title: Completion
    prompt: |
      All Gerrit review comments have been addressed, verified, amended, uploaded, and marked resolved on Gerrit!
      If new review comments arrive later, resume this session and wake this conversation with:
      `emu-dev-cli gerrit resume {cl} --state={state_id}`
    verifier_cmd: null
