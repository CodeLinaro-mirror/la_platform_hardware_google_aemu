# ==============================================================================
# Declarative Workflow Template (YAML)
# Reference: tools/emu-dev-cli/workflows/WORKFLOW_API.md
# ==============================================================================
#
# Instructions:
# 1. Copy this file to tools/emu-dev-cli/workflows/<your_workflow_name>/workflow.yaml
# 2. Update 'name' and 'description' below.
# 3. Define any positional/optional CLI arguments under 'args:'.
# 4. If needed, define custom initialization values under 'init:'.
#    (Note: Generic system metadata such as '{cache-dir}' is provisioned automatically).
# 5. Define sequential steps with prompt instructions and verifier commands.
# ==============================================================================

name: example-workflow
description: Example workflow demonstrating state persistence, step progression, and verifiers.

# ------------------------------------------------------------------------------
# 1. Optional CLI Arguments (args)
# ------------------------------------------------------------------------------
# Arguments accepted by 'emu-dev-cli workflow <name> init [args...]'.
# Parsed arguments are stored in session metadata and available as {arg_name}.
# args:
#   - name: bug-number
#     help: "Target Buganizer issue ID"
#     required: true

# ------------------------------------------------------------------------------
# 2. Optional Initialization (init)
# ------------------------------------------------------------------------------
# Evaluated ONCE when a session is initialized via 'emu-dev-cli workflow <name> init'.
#
# GENERIC SYSTEM METADATA:
# The workflow engine automatically provisions standard generic metadata into
# the session state before evaluating this section. These values are saved under
# 'metadata' and are available via {key} across all steps and init commands:
#   - {cache-dir}: Dedicated workflow cache directory (~/.cache/emu-dev-cli/workflows/<name>/)
#   - Additional generic engine metadata may be provided in future updates.
#
# If your workflow only needs standard scratch/output storage, omit 'init:' completely!
#
# Used only when your workflow needs custom runtime generation or constants:
# init:
#   hello-file:
#     cmd: "mktemp {cache-dir}/hello-workflow-XXXXXX.txt"
#   max-attempts: 3

# ------------------------------------------------------------------------------
# 3. Steps
# ------------------------------------------------------------------------------
# Array of step definitions executed in sequential index order (0, 1, 2, ...).
steps:
  # Step 0: Active step with automated shell verifier
  - step: 0
    title: Write Name
    prompt:
      - 'Created {hello-file}. Please write your name in the file as "Name: <your name>" (make up a funny name if you want)'
    verifier_cmd: "grep -qi '^Name:' {hello-file}"
    max_retries: 3
    error_prompt:
      - 'Error: Name not found in {hello-file} (attempt {retries} of {max_retries}). Please write your name in the file as "Name: <your name>" (make up a funny name if you want)'
    stuck_prompt:
      - 'Error: Name not found in {hello-file}. Workflow is now STUCK (retries reached {max_retries}). Please write your name in the file as "Name: <your name>" (make up a funny name if you want)'
    stuck_reason: "Failed to find 'Name: <your name>' in {hello-file} after {retries} retries."

  # Step 1: Second active step
  - step: 1
    title: Write Joke
    prompt:
      - 'Below your name on a new line, Write your best two-sentence joke as "Joke: <your-joke>"'
    verifier_cmd: "grep -qi '^Joke:' {hello-file}"
    max_retries: 3
    error_prompt:
      - 'Error: Joke not found in {hello-file} (attempt {retries} of {max_retries}). Write your joke below your name as "Joke: <your-joke>"'
    stuck_prompt:
      - 'Error: Joke not found in {hello-file}. Workflow is STUCK. Please add "Joke: <your-joke>" to {hello-file}'
    stuck_reason: "Failed to find 'Joke: <your-joke>' in {hello-file} after {retries} retries."

  # Step 2: Terminal Step (verifier_cmd is null)
  - step: 2
    title: Completion
    prompt:
      - "Congratulations! Both your name and joke have been verified in {hello-file}."
      - "Workflow completed successfully."
    verifier_cmd: null
    max_retries: 0
