# Code Review: Modularity & Decomposition Workflow (YAML)
# Reviews a commit to identify and refactor monolithic files and functions into modular components.

name: review-modularity
description: Review a commit to decompose monolithic files and functions into modular components.

args:
  - name: commit
    required: false
    default: "HEAD"
    help: "Target commit reference or hash to review (default: HEAD)"
  - name: repo
    required: false
    default: "."
    help: "Target Git repository directory (default: .)"

steps:
  - step: 0
    title: Review Commit for Monolithic Behavior and Improve Modularity
    prompt: |
      Please check commit '{commit}' in repository '{repo}' for any added files or functions that exhibit monolithic behavior and refactor them into modular components:

      1. Inspect the changes introduced in '{commit}' (e.g. via `git show {commit}` or `git diff {commit}~1..{commit}`).
      2. Check for monolithic behavior in modified or newly added code:
         - "God" functions or overly long routines trying to handle multiple responsibilities (e.g. mixing I/O, parsing, validation, business logic, and formatting in one place).
         - Functions with excessive cyclomatic/cognitive complexity, deep nesting, or too many branches and local variables.
         - Monolithic files that accumulate unrelated duties or lack clean boundaries between distinct concerns.
      3. If monolithic behavior is found:
         - Decompose large functions into smaller, single-purpose helper functions following the Single Responsibility Principle.
         - Separate distinct architectural concerns (e.g. extract parsing, formatting, or helper logic into dedicated utilities or modular classes).
         - Ensure the decomposed code remains cohesive, readable, and easy to unit test.
         - Verify that changes compile and any relevant tests pass.
         - Amend the commit (preserving any Gerrit Change-Id).
      4. If the commit is already well-modularized and exhibits clean separation of concerns:
         - Confirm that no changes are needed.
    verifier_cmd: null
