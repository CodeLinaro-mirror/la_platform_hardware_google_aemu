# Amend Commit Workflow (YAML)
# Guides amending the latest commit while preserving its Gerrit Change-Id.

name: amend-commit
description: Guide amending the latest commit while preserving its Gerrit Change-Id.

args:
  - name: repo
    required: false
    default: "."
    help: "Target Git repository directory (default: .)"

init:
  current-msg-file: "{cache-dir}/current_commit_msg_{state_id}.txt"
  proposed-msg-file: "{cache-dir}/proposed_commit_msg_{state_id}.txt"
  base-commit-file: "{cache-dir}/base_commit_{state_id}.txt"
  setup-files:
    cmd: "python3 {workflow_dir}/../common/git_commit/verifier_cli.py --mode=setup-msg-files {current-msg-file} {proposed-msg-file}"

steps:
  - step: 0
    title: Draft Proposed Commit Message
    prompt: |
      Please copy the current commit message for the commit you wish to amend into '{current-msg-file}',
      and write the new proposed amended commit message into '{proposed-msg-file}'.
      Follow Gerrit and Semantic Commit Message guidelines:
      1. Structure:
         <type>[optional scope]: <description>

         [body]

         [footer(s)]
      2. Subject Line Constraints:
         - Length: at most 50 characters, with no leading or trailing whitespace
         - Format: '<type>[optional scope]: <description>'
         - Allowed <type> (mandatory): feat, fix, build, docs, chore, test, refactor, perf, style
         - Grammar & Style: use the imperative mood (e.g. "Add", "Fix", "Refactor"), capitalize the first letter of <description>, and do NOT include a trailing period ('.')
      3. Separation & Body:
         - Separate the subject from the body with a blank line, and separate the body from the footers with a blank line
         - Include a non-empty explanatory body wrapped at 72 characters explaining what and why vs. how (exempt: markdown code blocks, quotes, indented text, or URLs)
      4. Footers & Bug Relevance:
         - Include a 'Bug: ' line with a bug number (e.g. 'Bug: 12345678') or 'Bug: N/A' (cross-check the referenced Buganizer issue against the code changes to verify the bug exists and is relevant to the change)
         - Include a 'Test: ' line describing the verification command or procedure, or 'TEST: N/A'
         - Exactly one Gerrit Change-Id line must be present and unmodified: match the Change-Id from '{current-msg-file}' (do not duplicate or include multiple Change-Id lines)
         - Include 'BREAKING CHANGE: <description>' in the footers if introducing breaking API changes
         - No 'Tag=' or 'CONV=' lines
         - No trailing spaces on any line, no leading spaces on subject or footer lines, no '#' comment lines, and no consecutive blank lines
    verifier_cmd: "python3 {workflow_dir}/../common/git_commit/verifier_cli.py --mode=verify-proposed-msg {proposed-msg-file} --current-file {current-msg-file} --base-commit-file {base-commit-file} --cwd \"{repo}\""
    error_prompt: |
      Proposed commit message verification failed (attempt {retries} of {max_retries}):
      {verifier_error}

      Please update the proposed commit message in '{proposed-msg-file}' to resolve the errors and satisfy all verification requirements.
    stuck_prompt: |
      Proposed commit message verification failed. Workflow is now STUCK (retries reached {max_retries}):
      {verifier_error}

      Please ensure '{proposed-msg-file}' satisfies all verification requirements.
    stuck_reason: "Proposed commit message verification failed after {retries} attempts: {verifier_error}"
    max_retries: 3

  - step: 1
    title: Amend Commit
    prompt: |
      The proposed commit message in '{proposed-msg-file}' has been verified.
      Please amend the commit using the verified commit message.
    verifier_cmd: "python3 {workflow_dir}/../common/git_commit/verifier_cli.py --mode=verify-amend --current-file {current-msg-file} --proposed-file {proposed-msg-file} --base-commit-file {base-commit-file} --commit HEAD --cwd \"{repo}\""
    error_prompt: |
      Commit amendment verification failed (attempt {retries} of {max_retries}):
      {verifier_error}

      Please amend the commit using the verified message from '{proposed-msg-file}'.
    stuck_prompt: |
      Commit amendment verification failed. Workflow is now STUCK (retries reached {max_retries}):
      {verifier_error}

      Please ensure the commit has been amended with the verified message.
    stuck_reason: "Commit amendment verification failed after {retries} attempts: {verifier_error}"
    max_retries: 3

  - step: 2
    title: Completion
    prompt: "Commit amended and verified successfully, preserving its Gerrit Change-Id."
    verifier_cmd: null
