# Create Commit Workflow (YAML)
# Guides the creation of a commit adhering to Gerrit guidelines and workflow verification requirements.

name: create-commit
description: Guide creating a commit meeting Gerrit standards and verification rules.

init:
  base-commit:
    cmd: "python3 {workflow_dir}/get_base_commit.py --cwd ."
  proposed-msg-file: "{cache-dir}/proposed_commit_msg_{state_id}.txt"
  setup-files:
    cmd: "python3 {workflow_dir}/setup_msg_files.py {proposed-msg-file}"

steps:
  - step: 0
    title: Draft Proposed Commit Message
    prompt: |
      Please write the proposed commit message for the changes in your working tree into '{proposed-msg-file}'.
      Follow Gerrit guidelines: craft a clear, concise subject line (50-72 characters), separate
      the subject from the body with a blank line, and wrap body lines at 72 characters explaining
      the rationale and impact. The proposed commit message must satisfy the following verification requirements:

      - No 'Tag=' or 'CONV=' lines
      - A 'Bug: ' line with a bug number (e.g. 'Bug: 12345678') or 'Bug: N/A'
      - A 'Test: ' line describing the verification command or procedure, or 'TEST: N/A'
    verifier_cmd: "python3 {workflow_dir}/verify_proposed_msg.py {proposed-msg-file}"
    error_prompt: |
      Proposed commit message verification failed (attempt {retries} of {max_retries}):
      {verifier_error}

      Please update the proposed commit message in '{proposed-msg-file}' to resolve the errors and satisfy all verification requirements.
    stuck_prompt: |
      Proposed commit message verification failed. Workflow is now STUCK (retries reached {max_retries}):
      {verifier_error}

      Please ensure '{proposed-msg-file}' satisfies all verification requirements.
    stuck_reason: "Proposed commit message verification failed after {retries} attempts: {verifier_error}"
    max_retries: 3

  - step: 1
    title: Create Commit
    prompt: |
      The proposed commit message in '{proposed-msg-file}' has been verified.
      Please create a commit for the changes in your working tree using the verified commit message.
    verifier_cmd: "python3 {workflow_dir}/verify_commit.py {base-commit} --proposed-file {proposed-msg-file} --cwd ."
    error_prompt: |
      Commit verification failed (attempt {retries} of {max_retries}):
      {verifier_error}

      Please create a commit using the verified message from '{proposed-msg-file}'.
    stuck_prompt: |
      Commit verification failed. Workflow is now STUCK (retries reached {max_retries}):
      {verifier_error}

      Please ensure your commit has been created with the verified message.
    stuck_reason: "Commit verification failed after {retries} attempts: {verifier_error}"
    max_retries: 3

  - step: 2
    title: Completion
    prompt: "Commit created and verified successfully according to Gerrit guidelines and workflow requirements."
    verifier_cmd: null
