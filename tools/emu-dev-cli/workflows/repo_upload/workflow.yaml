# Repo Upload Workflow (YAML)
# Guides the agent to upload the current branch commit(s) to Gerrit via repo upload.

name: repo-upload
description: Upload committed changes in the current branch to Gerrit via repo upload.

args:
  - name: repo
    help: "Target git repository path (defaults to current working directory)"
    required: false
    default: "."

steps:
  - step: 0
    title: Upload Changes to Gerrit
    description: Configure push.negotiate false and run repo upload --cbr in the target repository
    prompt: |
      Please upload the committed changes in '{repo}' to Gerrit:
      1. First disable git push negotiation to prevent `git fetch --negotiate-only` hangs on Git-on-Borg:
         `git config push.negotiate false` inside '{repo}'.
      2. Run `repo upload --cbr -y -o "nokeycheck" --verify .` (or `yes | repo upload --cbr .` if an interactive yes/no prompt appears) inside '{repo}'.
      Verify that the Gerrit CL URL is output and the upload succeeds.
    verifier_cmd: "python3 -c \"import sys; sys.exit(0)\""
    max_retries: 3

  - step: 1
    title: Completion
    prompt: "Changes uploaded to Gerrit successfully."
    verifier_cmd: null
