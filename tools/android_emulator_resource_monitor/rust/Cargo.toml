[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
csv = "1.4.0"
regex = "1.12.3"
sysinfo = "0.38.4"
tokio = { version = "1.52.0", features = ["full"] }
futures = "0.3.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
