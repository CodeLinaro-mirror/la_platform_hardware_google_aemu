syntax = "proto3";

package android.emulation.v2;

option go_package = "google.golang.org/aemu/protos/services/v2;v2pb";
option java_multiple_files = true;
option java_package = "com.android.emulator.v2";

// Specifies pixel and container encoding formats for still images and video frames.
//
// Note on AIP-126 (Enums vs. MIME strings):
// Explicit enums are used instead of free-form MIME strings because low-latency
// computer vision pipelines frequently stream uncompressed memory buffers
// (e.g., RGBA8888) that lack standardized IANA MIME representations.
enum ImageFormat {
  // Default value. For requests, defaults to IMAGE_FORMAT_PNG unless noted otherwise.
  IMAGE_FORMAT_UNSPECIFIED = 0;
  // Lossless PNG container encoding (recommended for OCR and vision models).
  IMAGE_FORMAT_PNG = 1;
  // Uncompressed 32-bit RGBA pixel buffer (4 bytes per pixel in R, G, B, A byte order).
  IMAGE_FORMAT_RAW_RGBA8888 = 2;
  // Lossy JPEG container encoding.
  IMAGE_FORMAT_JPEG = 3;
}

// Specifies binary sample encoding formats for raw PCM audio streams.
enum SampleFormat {
  // Default value. For requests, selects the device's native sample format.
  SAMPLE_FORMAT_UNSPECIFIED = 0;
  // Signed 16-bit little-endian integer samples in range [-32768, 32767].
  SAMPLE_FORMAT_PCM16_BIT = 1;
  // 32-bit IEEE 754 floating-point samples normalized to [-1.0, 1.0].
  SAMPLE_FORMAT_F32_BIT = 2;
}

// Identifies media track categories negotiated within a WebRTC peer connection.
enum TrackType {
  // Default unspecified track type.
  TRACK_TYPE_UNSPECIFIED = 0;
  // Primary display (`display_id == 0`) hardware-accelerated video track.
  TRACK_TYPE_SCREEN_PRIMARY = 1;
  // Secondary display video track (e.g., foldable outer cover display or virtual display).
  TRACK_TYPE_SCREEN_SECONDARY = 2;
  // Device speaker output audio track (Opus encoded).
  TRACK_TYPE_AUDIO_SPEAKER = 3;
  // Client-to-device microphone injection audio track.
  TRACK_TYPE_AUDIO_MICROPHONE = 4;
}

// Enumerates 90-degree orthogonal display rotation angles.
enum Rotation {
  // Default unspecified rotation (treated as ROTATION_DEG0 when applied).
  ROTATION_UNSPECIFIED = 0;
  // Natural portrait orientation (0 degrees).
  ROTATION_DEG0 = 1;
  // Landscape left orientation (90 degrees counter-clockwise).
  ROTATION_DEG90 = 2;
  // Inverted portrait orientation (180 degrees).
  ROTATION_DEG180 = 3;
  // Landscape right orientation (270 degrees counter-clockwise / 90 degrees clockwise).
  ROTATION_DEG270 = 4;
}

// Describes what the caller is permitted to do with a subsystem.
//
// This is a pure permission axis. How faithfully the subsystem is implemented is
// reported separately by `Fidelity`; the two are independent, and conflating them
// made read-only mocks unrepresentable.
enum AccessMode {
  // Default unspecified access mode.
  ACCESS_MODE_UNSPECIFIED = 0;
  // Telemetry can be queried and streamed, but state mutations fail with PERMISSION_DENIED.
  ACCESS_MODE_READ_ONLY = 1;
  // Full read and write control over the subsystem.
  ACCESS_MODE_READ_WRITE = 2;
}

// Describes how faithfully a subsystem is implemented behind the API.
//
// Orthogonal to `AccessMode`: a subsystem may be writable but mocked, or
// read-only yet backed by real hardware. Clients use this to decide whether a
// value is authoritative, to label simulated state in a UI, and to judge whether
// an assertion about device behaviour is meaningful.
enum Fidelity {
  // Default unspecified fidelity. Treat as FIDELITY_HARDWARE for compatibility
  // with servers predating this field.
  FIDELITY_UNSPECIFIED = 0;
  // Backed by the real hardware peripheral or its HAL. Reads reflect true device
  // state; writes drive the actual subsystem.
  FIDELITY_HARDWARE = 1;
  // Backed by an Android framework override rather than the hardware itself
  // (e.g., `dumpsys battery set` on a physical device, or the mock location
  // provider). Values are plausible but synthetic: the real subsystem may
  // reassert itself, state may not survive a reboot, and some apps can detect
  // the override.
  FIDELITY_SOFTWARE_MOCK = 2;
}

// Distinguishes emulated devices from real hardware.
//
// Determines what is *possible* on a device, and is the axis the capability
// messages ultimately reflect. It deliberately says nothing about where the
// device is: whether the transport is a loopback socket, an `adb forward`
// tunnel, or a remote connection is something the client already knows and the
// server generally cannot.
//
// Prefer branching on a specific capability over branching on this field.
// `device_kind` is for presentation (badges, iconography, defaults) and
// telemetry; capability messages are for deciding what to call.
enum DeviceKind {
  // Default unspecified device kind.
  DEVICE_KIND_UNSPECIFIED = 0;
  // Physical Android hardware, typically reached over ADB.
  DEVICE_KIND_PHYSICAL = 1;
  // Emulated device running under a hypervisor.
  DEVICE_KIND_EMULATED = 2;
}

// Represents a flat 2D axis-aligned bounding rectangle in normalized display coordinates [0.0, 1.0].
//
// Matches Web/DOM DOMRect and HTML5 Canvas rect(x, y, width, height) conventions.
message NormalizedRect {
  // Normalized horizontal coordinate of the rectangle's top-left origin [0.0, 1.0] (defaults to 0.0).
  float x = 1;
  // Normalized vertical coordinate of the rectangle's top-left origin [0.0, 1.0] (defaults to 0.0).
  float y = 2;
  // Normalized width of the rectangle relative to display logical width [0.0, 1.0] (defaults to 0.0).
  float width = 3;
  // Normalized height of the rectangle relative to display logical height [0.0, 1.0] (defaults to 0.0).
  float height = 4;
}
