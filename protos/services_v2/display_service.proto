syntax = "proto3";

package android.emulation.v2;

option go_package = "google.golang.org/aemu/protos/services/v2;v2pb";
option java_multiple_files = true;
option java_package = "com.android.emulator.v2";

import "common.proto";
import "google/api/field_behavior.proto";

// Manages physical and virtual display geometry, rotation, brightness, multi-display lifecycle,
// and captures single-frame screenshots and continuous composited frame streams from SurfaceFlinger.
service DisplayService {
  // Lists current state and geometry for all active displays attached to the device.
  rpc ListDisplays(ListDisplaysRequest) returns (ListDisplaysResponse);

  // Returns the current state and geometry of a single display by ID.
  //
  // Expected gRPC status codes:
  //   - NOT_FOUND: No active display matches `display_id`.
  rpc GetDisplay(GetDisplayRequest) returns (Display);

  // Streams real-time display list snapshots whenever resolution, rotation, brightness, or flags change.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamDisplaysRequest` (optionally filtering by `display_id`).
  //   2. Server immediately emits the current `ListDisplaysResponse` snapshot as the first message.
  //   3. Server pushes updated `ListDisplaysResponse` snapshots whenever display geometry, rotation, or flags change.
  //   4. Client cancels the RPC context to unsubscribe.
  rpc StreamDisplays(StreamDisplaysRequest)
      returns (stream ListDisplaysResponse);

  // Partially or fully updates mutable display properties (rotation, brightness, dynamic resolution).
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Invalid dimensions/density.
  //   - NOT_FOUND: Specified `display_id` does not exist.
  //   - FAILED_PRECONDITION: Attempted dynamic resizing on a display where `supports_dynamic_resizing` is false.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc UpdateDisplay(UpdateDisplayRequest) returns (Display);

  // Attaches a new secondary virtual display to the device.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Missing or non-positive `width`, `height`, or `density_dpi`.
  //   - RESOURCE_EXHAUSTED: Active display count has reached `DisplayCapabilities.max_supported_display_count`.
  //   - FAILED_PRECONDITION: Device does not support virtual displays (`supports_virtual_display_creation == false`).
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc CreateDisplay(CreateDisplayRequest) returns (Display);

  // Detaches and destroys a secondary virtual display.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Attempted to delete the primary display (`display_id == 0`).
  //   - NOT_FOUND: No secondary display matches `display_id`.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc DeleteDisplay(DeleteDisplayRequest) returns (DeleteDisplayResponse);

  // Captures and returns the most recently composited frame for the requested display.
  //
  // Requesting a `format` absent from `DisplayCapabilities.screen_capture.supported_formats`
  // fails with `INVALID_ARGUMENT` rather than silently falling back to another format.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Requested `format` is not in `DisplayCapabilities.screen_capture.supported_formats`.
  //   - NOT_FOUND: Specified `display_id` does not exist.
  //   - FAILED_PRECONDITION: Display is blanked or protected by `DISPLAY_FLAG_SECURE`.
  rpc GetScreenshot(GetScreenshotRequest) returns (Screenshot);

  // Streams display frames to the client as SurfaceFlinger composites new buffers.
  //
  // Requesting a `format` absent from `DisplayCapabilities.screen_capture.supported_formats`
  // fails with `INVALID_ARGUMENT` rather than silently falling back to another format.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamScreenshotsRequest`.
  //   2. Server immediately emits the latest composited `Screenshot` as the first message.
  //   3. Server pushes subsequent `Screenshot` messages on each composite (throttled to `max_frames_per_second` if set).
  //   4. Under client backpressure, intermediate frames are dropped so the client always receives the freshest frame.
  //   5. Client MUST cancel the RPC context when finished to release GPU readback buffers.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: `max_frames_per_second` is <= 0.0, or requested `format` is not in `supported_formats`.
  //   - NOT_FOUND: Specified `display_id` does not exist.
  rpc StreamScreenshots(StreamScreenshotsRequest) returns (stream Screenshot);
}

// Enumerates Android DisplayManager surface policy flags.
enum DisplayFlag {
  // Default unspecified display flag.
  DISPLAY_FLAG_UNSPECIFIED = 0;
  // Display allows non-system public windows (Android Display.FLAG_PUBLIC).
  DISPLAY_FLAG_PUBLIC = 1;
  // Display is designated as an external presentation target (Android Display.FLAG_PRESENTATION).
  DISPLAY_FLAG_PRESENTATION = 2;
  // Display enforces HDCP/DRM protection; screen capture and WebRTC frames are blanked (Android Display.FLAG_SECURE).
  DISPLAY_FLAG_SECURE = 3;
  // Display shows its own independent task stack rather than mirroring the primary display.
  DISPLAY_FLAG_OWN_CONTENT_ONLY = 4;
  // Display automatically mirrors the primary display when no dedicated presentation window is active.
  DISPLAY_FLAG_AUTO_MIRROR = 5;
}

// Request message for listing all active displays.
message ListDisplaysRequest {}

// Response message containing the state of all active displays.
message ListDisplaysResponse {
  // Active displays ordered by `display_id` (display 0 is always the primary display).
  repeated Display displays = 1;
}

// Request message for retrieving a single display's state.
message GetDisplayRequest {
  // Target display identifier (0 for the primary display).
  int32 display_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for subscribing to display list updates.
message StreamDisplaysRequest {
  // Optional filter restricting streamed updates to a single `display_id`. When unset, streams all displays.
  optional int32 display_id = 1;
}

// Represents the runtime geometry, orientation, brightness, and flags of a single display resource.
//
// --- Display Orientation Model (`rotation` vs. `user_rotation`) ---
// On both physical and emulated devices, the chassis orientation requested by
// the user (`user_rotation`) and the logical framebuffer orientation rendered
// by Android's WindowManager (`rotation`) frequently diverge:
//   1. Orientation-locked apps / Home Screen: Rotating the device to 90° while
//      on a portrait-locked Launcher leaves `rotation` at 0° until a landscape
//      app is opened.
//   2. App-forced landscape: Launching a landscape game while holding the
//      device at 0° changes `rotation` to 90° while `user_rotation` stays 0°.
//   3. 180° policy restriction: Most phones set `config_allowAllRotations=false`,
//      leaving `rotation` at 0° when `user_rotation` is set to 180°.
//
// --- Rotating a Device & Capturing Post-Rotation Screenshots ---
// To deterministically rotate the device (e.g., to landscape ROTATION_DEG90):
//   1. Call `UpdateDisplay` with `user_rotation = ROTATION_DEG90` and
//      `auto_rotation_enabled = false`.
//   2. Android WindowManager rotation is asynchronous (typically 100ms-500ms).
//      Before taking a screenshot or computing layout bounds, wait for
//      `StreamDisplays` (or `Screenshot.rotation`) to report
//      the target `rotation`.
//
// Client / UI Rendering Contract:
//   `Rotation` is an enum, not an angle: ROTATION_DEG0..ROTATION_DEG270 are
//   the ordinals 1..4. Convert before doing arithmetic:
//       degrees(r) = (r - 1) * 90, treating ROTATION_UNSPECIFIED (0) as 0.
//   - Outer device bezel angle  = degrees(user_rotation)
//   - Inner video canvas offset =
//         (degrees(user_rotation) - degrees(rotation) + 360) % 360
//     The `+ 360` is required: `%` returns a negative result for negative
//     operands in C++, Java, and JavaScript.
message Display {
  // Unique display identifier (0 selects the primary display; defaults to 0).
  int32 display_id = 1;
  // Output only. True if this is the primary display (`display_id == 0`). Cannot be reassigned via UpdateDisplay.
  bool primary = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Active display width in pixels (mutable only if `DisplayHardware.supports_dynamic_resizing` is true; must be > 0).
  int32 width = 3;
  // Active display height in pixels (mutable only if `DisplayHardware.supports_dynamic_resizing` is true; must be > 0).
  int32 height = 4;
  // Active display density in dots per inch (mutable only if `DisplayHardware.supports_dynamic_resizing` is true; must be > 0).
  int32 density_dpi = 5;
  // Output only. Logical OS display rotation reported by Android WindowManager (`DisplayInfo.rotation`).
  // Reflects the actual orientation of the rendered framebuffer/stream content. To rotate the device, set `user_rotation`.
  Rotation rotation = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Screen backlight brightness percentage in range [0.0, 100.0] (0.0 represents minimum backlight; defaults to 0.0).
  float brightness_percent = 7;
  // True if automatic ambient-light adaptive brightness is enabled in Android Settings.
  bool auto_brightness_enabled = 8;
  // Output only. Active OS and hardware surface flags on this display (e.g., DISPLAY_FLAG_SECURE).
  repeated DisplayFlag flags = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // True if display rotation follows accelerometer gravity; false if frozen to `user_rotation`.
  bool auto_rotation_enabled = 10;
  // Physical/chassis orientation set by the user in the host UI.
  Rotation user_rotation = 11;
}

// Request message for partially or fully mutating display properties.
//
// Only fields explicitly set on the wire are modified; omitted fields leave
// the display's current properties untouched.
message UpdateDisplayRequest {
  // Target display identifier (0 for the primary display; defaults to 0).
  int32 display_id = 1;
  // Desired display width in pixels (requires `DisplayHardware.supports_dynamic_resizing`).
  optional int32 width = 2;
  // Desired display height in pixels (requires `DisplayHardware.supports_dynamic_resizing`).
  optional int32 height = 3;
  // Desired display density in dots per inch (requires `DisplayHardware.supports_dynamic_resizing`).
  optional int32 density_dpi = 4;
  // Desired screen backlight brightness percentage in range [0.0, 100.0].
  optional float brightness_percent = 5;
  // Desired automatic ambient-light adaptive brightness state.
  optional bool auto_brightness_enabled = 6;
  // Desired accelerometer auto-rotation state.
  optional bool auto_rotation_enabled = 7;
  // Desired physical/chassis orientation set by the user.
  optional Rotation user_rotation = 8;
}

// Request message for attaching a new secondary virtual display.
//
// Requires `width`, `height`, and `density_dpi` to be positive integers.
// If `display_id` is 0 or omitted, the server allocates the next available
// secondary display ID (returned in the response `Display`).
message CreateDisplayRequest {
  // Optional display ID (if 0 or omitted, the server allocates the next available secondary display ID).
  int32 display_id = 1;
  // Initial display width in pixels (must be > 0).
  int32 width = 2 [(google.api.field_behavior) = REQUIRED];
  // Initial display height in pixels (must be > 0).
  int32 height = 3 [(google.api.field_behavior) = REQUIRED];
  // Initial display density in dots per inch (must be > 0).
  int32 density_dpi = 4 [(google.api.field_behavior) = REQUIRED];
  // Optional Android DisplayManager surface policy flags (e.g., `[DISPLAY_FLAG_PUBLIC, DISPLAY_FLAG_PRESENTATION]`).
  // Once created, `flags` are immutable and treated as `OUTPUT_ONLY` during `UpdateDisplay`.
  repeated DisplayFlag flags = 5;
}

// Request message for detaching and destroying a secondary virtual display.
message DeleteDisplayRequest {
  // Identifier of the secondary display to delete (must be > 0; primary display 0 cannot be deleted).
  int32 display_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for deleting a secondary virtual display.
message DeleteDisplayResponse {}

// Request message for capturing a single screenshot frame.
message GetScreenshotRequest {
  // Target display identifier (0 selects the primary display; defaults to 0).
  int32 display_id = 1;
  // Desired pixel or container encoding format (`IMAGE_FORMAT_UNSPECIFIED` defaults to `IMAGE_FORMAT_PNG`).
  // Must be listed in `DisplayCapabilities.screen_capture.supported_formats`; otherwise fails with `INVALID_ARGUMENT`.
  ImageFormat format = 2;
}

// Request message for subscribing to continuous screenshot frames.
message StreamScreenshotsRequest {
  // Target display identifier (0 selects the primary display; defaults to 0).
  int32 display_id = 1;
  // Desired pixel or container encoding format (`IMAGE_FORMAT_UNSPECIFIED` defaults to `IMAGE_FORMAT_PNG`).
  // Must be listed in `DisplayCapabilities.screen_capture.supported_formats`; otherwise fails with `INVALID_ARGUMENT`.
  ImageFormat format = 2;
  // Maximum emission rate in frames per second (must be > 0.0 when set).
  // When unset, emits at the display's native composite refresh rate.
  optional float max_frames_per_second = 3;
}

// Captured display frame and associated geometry/timing metadata.
//
// --- Orientation & Input Coordinate Alignment ---
// `image_data` is always oriented upright to match the active logical display
// rotation (`rotation`). In landscape (ROTATION_DEG90 / DEG270),
// `width` and `height` reflect the rotated dimensions (e.g., width=2400, height=1080).
// Any pixel (px, py) located in `image_data` maps directly to normalized
// InputService Pointer coordinates via:
//   Pointer.x = px / Screenshot.width
//   Pointer.y = py / Screenshot.height
message Screenshot {
  // Output only. Encoded image container bytes (PNG/JPEG) or raw uncompressed pixel buffer.
  bytes image_data = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Captured frame width in pixels matching the active display rotation.
  int32 width = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Captured frame height in pixels matching the active display rotation.
  int32 height = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Hardware GPU row stride in bytes for uncompressed formats
  // (e.g., IMAGE_FORMAT_RAW_RGBA8888). Row `r` starts at byte offset
  // `r * row_stride_bytes` and contains `width * 4` pixel bytes followed by
  // `(row_stride_bytes - width * 4)` alignment padding bytes.
  int32 row_stride_bytes = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Monotonically increasing SurfaceFlinger frame composition counter.
  int64 frame_sequence_number = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Active logical OS display rotation (`DisplayInfo.rotation`).
  Rotation rotation = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Monotonic presentation timestamp in nanoseconds (`CLOCK_MONOTONIC`), aligned with `AudioChunk.timestamp_nanos`.
  int64 presentation_time_nanos = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Display density scaling factor relative to the Android baseline density of 160 dpi (mdpi = 1.0).
  //
  // Calculated as `density_dpi / 160.0` (e.g., mdpi = 1.0, hdpi = 1.5, xhdpi = 2.0, xxhdpi = 3.0, xxxhdpi = 4.0).
  float density_scale = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}
