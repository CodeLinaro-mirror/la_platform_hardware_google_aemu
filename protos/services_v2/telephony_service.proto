syntax = "proto3";

package android.emulation.v2;

option go_package = "google.golang.org/protobuf/types/known/emulation/v2;emulationv2";
option java_multiple_files = true;
option java_package = "com.android.emulator.v2";

import "google/api/field_behavior.proto";

// Observes and controls cellular radio registration, signal strength, SMS delivery, and voice calls.
service TelephonyService {
  // Returns the current cellular baseband power, registration, signal strength, radio technology, and active voice calls.
  //
  // Recommended client deadline: >= 500ms.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: Device has no cellular modem subsystem.
  rpc GetTelephonyState(GetTelephonyStateRequest) returns (TelephonyState);

  // Streams real-time cellular telephony state changes as registration, signal strength, RAT, or active voice calls change.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamTelephonyStateRequest`.
  //   2. Server immediately sends the current `TelephonyState` snapshot as the first message.
  //   3. Server pushes subsequent `TelephonyState` snapshots whenever modem or call state changes.
  //   4. Client cancels the RPC context to unsubscribe.
  rpc StreamTelephonyState(StreamTelephonyStateRequest) returns (stream TelephonyState);

  // Partially or fully updates the simulated cellular modem radio state.
  //
  // Recommended client deadline: >= 1000ms.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: Device has no cellular modem subsystem.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc UpdateTelephonyState(UpdateTelephonyStateRequest) returns (TelephonyState);

  // Delivers a synthetic inbound SMS message to the device's cellular modem.
  //
  // Recommended client deadline: >= 1000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Empty or invalid GSM phone number or message body exceeding 1024 UTF-8 characters.
  //   - FAILED_PRECONDITION: Device does not support SMS simulation (`TELEPHONY_FEATURE_SMS_SIMULATION` absent from `TelephonyCapabilities.supported_features`).
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc SendSms(SendSmsRequest) returns (SendSmsResponse);

  // Initiates or transitions a simulated voice call through its lifecycle (ring, accept, hold, unhold, disconnect).
  //
  // Recommended client deadline: >= 1000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: `action` is `ACTION_UNSPECIFIED` or `caller_phone_number` is empty/malformed.
  //   - FAILED_PRECONDITION: Device does not support call simulation or requested state transition is invalid.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc TransitionCall(TransitionCallRequest)
      returns (TransitionCallResponse);
}

// Request message for querying the current cellular telephony state.
message GetTelephonyStateRequest {}

// Request message for subscribing to cellular telephony state updates.
message StreamTelephonyStateRequest {}

// Describes an active or ringing voice call on the cellular modem.
message CallState {
  // Classifies the lifecycle status of a voice call.
  enum Status {
    // Default unspecified call status.
    STATUS_UNSPECIFIED = 0;
    // Incoming call is ringing and awaiting user answer/rejection.
    INCOMING = 1;
    // Call is connected and audio is active.
    ACTIVE = 2;
    // Call is connected and placed on hold.
    HELD = 3;
    // Outgoing call is dialing.
    DIALING = 4;
    // Call has disconnected/terminated.
    DISCONNECTED = 5;
  }

  // Unique identifier for the call session.
  string call_id = 1;
  // Remote party phone number in GSM/E.164 format (e.g., "+18005550199").
  string caller_phone_number = 2;
  // Current lifecycle status of the voice call.
  Status status = 3;
}

// Represents cellular baseband power, network registration, signal strength, radio access technology, and active calls.
//
// Note: `TelephonyState` controls the cellular modem registration status, signal bars,
// and reported radio access technology (`GSM`, `UMTS`, `LTE`, `NR5G_SUB6`, `NR5G_MMWAVE`). Setting
// `registration_state = DENIED` (or `radio_powered = false`) simulates complete
// loss of cellular connectivity for offline/outbox testing. IP-layer packet
// latency/bandwidth shaping is configured separately at the virtual network layer.
message TelephonyState {
  // Classifies cellular network registration states reported to Android TelephonyManager.
  enum Registration {
    // Default unspecified registration state.
    REGISTRATION_UNSPECIFIED = 0;
    // Registered on the subscriber's home carrier network.
    HOME_NETWORK = 1;
    // Registered on a visited roaming partner network.
    ROAMING = 2;
    // Modem is actively scanning for available cellular carriers.
    SEARCHING = 3;
    // Network registration denied by carrier (emergency calls only / offline outbox mode).
    DENIED = 4;
  }
  // Classifies abstract cellular signal strength bar levels.
  enum Strength {
    // Default unspecified signal strength.
    STRENGTH_UNSPECIFIED = 0;
    // No signal or unknown signal level (0 bars).
    NONE_OR_UNKNOWN = 1;
    // Poor signal level (1 bar / ~25%).
    POOR = 2;
    // Moderate signal level (2 bars / ~50%).
    MODERATE = 3;
    // Good signal level (3 bars / ~75%).
    GOOD = 4;
    // Great signal level (4 bars / 100%).
    GREAT = 5;
  }
  // Classifies cellular radio access technologies (RAT) reported by the baseband modem.
  enum Technology {
    // Default unspecified radio access technology.
    TECHNOLOGY_UNSPECIFIED = 0;
    // 2G GSM family (covers GSM, GPRS, EDGE).
    GSM = 1;
    // 3G UMTS / WCDMA / HSPA family.
    UMTS = 2;
    // 4G Long-Term Evolution (LTE).
    LTE = 3;
    // 5G New Radio Sub-6 GHz.
    NR5G_SUB6 = 4;
    // 5G New Radio millimeter wave (mmWave).
    NR5G_MMWAVE = 5;
  }

  // True when the cellular baseband radio is powered on; false when Airplane Mode is active.
  bool radio_powered = 1;
  // Active cellular radio access technology reported to Android TelephonyManager.
  Technology active_technology = 2;
  // Current cellular signal strength bar level.
  Strength signal_strength = 3;
  // Current carrier network registration status.
  Registration registration_state = 4;
  // Output only. Currently active, ringing, dialing, or held voice calls.
  repeated CallState active_calls = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for partially or fully mutating cellular telephony state.
//
// Only fields explicitly set on the wire are modified; omitted fields leave
// the device's current radio properties untouched. Setting a field to its
// zero/false value (e.g., `radio_powered = false`) explicitly updates that property.
message UpdateTelephonyStateRequest {
  // Desired cellular baseband radio power state (false enables Airplane Mode).
  optional bool radio_powered = 1;
  // Desired active cellular radio access technology.
  optional TelephonyState.Technology active_technology = 2;
  // Desired cellular signal strength bar level.
  optional TelephonyState.Strength signal_strength = 3;
  // Desired carrier network registration status.
  optional TelephonyState.Registration registration_state = 4;
}

// Request message for delivering a synthetic inbound SMS message.
message SendSmsRequest {
  // Originating sender phone number in GSM/E.164 format (e.g., "+16505551234"; must be non-empty).
  string sender_phone_number = 1 [(google.api.field_behavior) = REQUIRED];
  // UTF-8 SMS text payload (up to 1024 characters).
  string message_body = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for SendSms.
message SendSmsResponse {}

// Request message for triggering or transitioning a simulated voice call.
//
// --- Voice Call State Machine ---
//   `RING` (incoming alert) -> `ACCEPT` (active) <-> `HOLD` / `UNHOLD` -> `DISCONNECT` (terminated)
//   (A ringing call may also transition directly from `RING` -> `DISCONNECT` to simulate hangup/rejection.)
//
// All transitions targeting an existing call (`ACCEPT`, `HOLD`, `UNHOLD`, `DISCONNECT`)
// MUST pass the same `caller_phone_number` that initiated the call via `RING`.
message TransitionCallRequest {
  // Specifies lifecycle state transitions for a simulated voice call.
  enum Action {
    // Rejected default value; callers MUST specify an explicit call action.
    ACTION_UNSPECIFIED = 0;
    // Initiate an incoming call ringing alert (transitions call state to INCOMING).
    RING = 1;
    // Disconnect and terminate the call (transitions call state to DISCONNECTED).
    DISCONNECT = 2;
    // Accept / answer the incoming call (transitions call state to ACTIVE).
    ACCEPT = 3;
    // Place the active call on hold (transitions call state to HELD).
    HOLD = 4;
    // Resume a held call (transitions call state back to ACTIVE).
    UNHOLD = 5;
  }
  // Originating caller phone number in GSM/E.164 format (e.g., "+18005550199").
  string caller_phone_number = 1 [(google.api.field_behavior) = REQUIRED];
  // Lifecycle action to apply to the call. `ACTION_UNSPECIFIED` fails with `INVALID_ARGUMENT`.
  Action action = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for TransitionCall.
message TransitionCallResponse {
  // Resulting state of the transitioned call.
  CallState call = 1;
}
