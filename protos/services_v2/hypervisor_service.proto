syntax = "proto3";

package android.emulation.v2;

option go_package = "google.golang.org/protobuf/types/known/emulation/v2;emulationv2";
option java_multiple_files = true;
option java_package = "com.android.emulator.v2";

import "google/api/field_behavior.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/timestamp.proto";

// Observes and controls hypervisor execution state, virtual machine lifecycle transitions,
// and local/cloud VM snapshots (RAM dumps, device state, and qcow2 disk overlays).
//
// Unavailable on physical hardware targets (`CapabilitiesService.vm` and
// `CapabilitiesService.snapshot` are unset).
service HypervisorService {
  // Returns the current hypervisor execution state and allocated compute resources.
  //
  // Recommended client deadline: >= 500ms.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: Target endpoint is a physical hardware device (`CapabilitiesService.vm` is unset).
  rpc GetVmState(GetVmStateRequest) returns (VmState);

  // Streams real-time hypervisor execution state transitions.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamVmStateRequest`.
  //   2. Server immediately sends the current `VmState` snapshot as the first message.
  //   3. Server pushes subsequent `VmState` messages whenever hypervisor state transitions occur.
  //   4. Client cancels the RPC context to unsubscribe.
  rpc StreamVmState(StreamVmStateRequest) returns (stream VmState);

  // Suspends guest vCPU execution and freezes virtual device timers without saving to disk.
  //
  // Recommended client deadline: >= 1000ms.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: VM is not currently in `RUNNING` state or does not support pause/resume.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc PauseVm(PauseVmRequest) returns (VmState);

  // Resumes guest vCPU execution from a previously paused state.
  //
  // Recommended client deadline: >= 1000ms.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: VM is not currently in `PAUSED` state.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc ResumeVm(ResumeVmRequest) returns (VmState);

  // Triggers a warm ACPI system reset of the virtual machine.
  //
  // Recommended client deadline: >= 2000ms.
  //
  // Expected gRPC status codes:
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc ResetVm(ResetVmRequest) returns (VmState);

  // Performs an immediate cold power-cycle reset (clears volatile RAM and reinitializes virtual hardware).
  //
  // Recommended client deadline: >= 2000ms.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: Hypervisor does not support hard reset (`VM_OPERATION_HARD_RESET` absent from `VmCapabilities.supported_operations`).
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc HardResetVm(HardResetVmRequest) returns (VmState);

  // Initiates graceful emulator hypervisor termination (process exits with status 0).
  //
  // Recommended client deadline: >= 5000ms.
  //
  // Expected gRPC status codes:
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc StopVm(StopVmRequest) returns (VmState);

  // Lists all snapshots stored in the emulator's local snapshot directory.
  //
  // Recommended client deadline: >= 1000ms.
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

  // Retrieves metadata and host compatibility details for a specific snapshot.
  //
  // Recommended client deadline: >= 500ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: `snapshot_id` is empty.
  //   - NOT_FOUND: No local snapshot matches `snapshot_id`.
  rpc GetSnapshot(GetSnapshotRequest) returns (Snapshot);

  // Updates mutable metadata (`display_name`, `description`) for an existing local snapshot.
  //
  // Recommended client deadline: >= 500ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: `snapshot_id` is empty.
  //   - NOT_FOUND: No local snapshot matches `snapshot_id`.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc UpdateSnapshot(UpdateSnapshotRequest) returns (Snapshot);

  // Captures a local VM snapshot (RAM + device state + qcow2 overlay) via a Long-Running Operation.
  //
  // If `snapshot_id` is omitted or empty, a unique filesystem-safe identifier is automatically
  // generated by the server and returned in both `SnapshotOperationMetadata.snapshot_id` and the
  // resulting `Snapshot.snapshot_id`.
  //
  // LONG-RUNNING OPERATION CONTRACT:
  //   - `Operation.name` format: `"operations/snapshots/{operation_uuid}"` hosted on the standard
  //     `google.longrunning.Operations` gRPC service on the same endpoint.
  //   - Cancellation semantics: Calling `Operations.CancelOperation` aborts snapshot serialization,
  //     resumes guest vCPU execution if paused, and deletes any partially written snapshot directory.
  //
  // Recommended client deadline for initial LRO creation call: >= 5000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: `snapshot_id` contains invalid path characters.
  //   - FAILED_PRECONDITION: VM is not running or snapshot support is disabled.
  //   - RESOURCE_EXHAUSTED: Insufficient host disk space to write snapshot image.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "Snapshot"
      metadata_type: "SnapshotOperationMetadata"
    };
  }

  // Reverts the running VM to a previously captured local snapshot via a Long-Running Operation.
  //
  // LONG-RUNNING OPERATION CONTRACT:
  //   - `Operation.name` format: `"operations/snapshots/{operation_uuid}"`.
  //   - Cancellation semantics: Calling `Operations.CancelOperation` during `PREPARING` aborts the
  //     restore and keeps the current VM state running; cancellation during `TRANSFERRING` is best-effort.
  //
  // Recommended client deadline for initial LRO creation call: >= 5000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: `snapshot_id` is empty.
  //   - NOT_FOUND: No local snapshot matches `snapshot_id`.
  //   - FAILED_PRECONDITION: Snapshot hardware fingerprint is incompatible with the current host (`host_compatible == false`).
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "Snapshot"
      metadata_type: "SnapshotOperationMetadata"
    };
  }

  // Permanently deletes a local snapshot and reclaims its disk storage.
  //
  // Recommended client deadline: >= 2000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: `snapshot_id` is empty.
  //   - NOT_FOUND: No local snapshot matches `snapshot_id`.
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);

  // Designates a local snapshot as the active quickboot target, or clears it to force a cold boot.
  //
  // Recommended client deadline: >= 500ms.
  //
  // Expected gRPC status codes:
  //   - NOT_FOUND: Specified `snapshot_id` does not exist locally.
  rpc SetQuickbootTarget(SetQuickbootTargetRequest)
      returns (SetQuickbootTargetResponse);

  // Uploads a local snapshot archive to remote cloud storage via a Long-Running Operation.
  //
  // Does not pause or mutate the running VM state.
  // Recommended client deadline for initial LRO creation call: >= 5000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Missing `snapshot_id` or missing `destination`.
  //   - NOT_FOUND: `snapshot_id` does not exist in `ListSnapshots()`.
  rpc ExportSnapshot(ExportSnapshotRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "Snapshot"
      metadata_type: "SnapshotOperationMetadata"
    };
  }

  // Downloads a snapshot archive from remote cloud storage to local disk via a Long-Running Operation.
  //
  // Does not boot the VM; call `RestoreSnapshot` after completion to activate it.
  // If `snapshot_id` is omitted or empty, a unique filesystem-safe identifier is automatically
  // generated by the server.
  // Idempotent: if `snapshot_id` already exists locally with matching checksums, completes immediately.
  // Recommended client deadline for initial LRO creation call: >= 5000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Missing `source` or `snapshot_id` contains invalid path characters.
  //   - RESOURCE_EXHAUSTED: Insufficient local disk space for the downloaded archive.
  rpc ImportSnapshot(ImportSnapshotRequest) returns (google.longrunning.Operation) {
    option (google.longrunning.operation_info) = {
      response_type: "Snapshot"
      metadata_type: "SnapshotOperationMetadata"
    };
  }
}

// Request message for querying hypervisor execution state.
message GetVmStateRequest {}

// Request message for subscribing to hypervisor execution state transitions.
message StreamVmStateRequest {}

// Represents the hypervisor execution state and allocated virtual hardware resources.
message VmState {
  // Classifies the runtime execution state of the virtual machine hypervisor.
  enum State {
    // Default unspecified hypervisor state.
    STATE_UNSPECIFIED = 0;
    // Guest vCPUs are actively executing instructions.
    RUNNING = 1;
    // Guest vCPU execution and virtual clocks are suspended in memory.
    PAUSED = 2;
    // Virtual machine execution has terminated.
    STOPPED = 3;
    // Hypervisor is executing a warm or cold hardware reset.
    RESETTING = 4;
    // Hypervisor is executing shutdown and optional quickboot snapshot capture.
    SHUTTING_DOWN = 5;
    // Hypervisor is paused while capturing and writing a snapshot to disk.
    SAVING_SNAPSHOT = 6;
    // Hypervisor is paused while loading and restoring VM state from a snapshot.
    RESTORING_SNAPSHOT = 7;
  }
  // Output only. Current hypervisor execution state.
  State state = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Number of host CPU cores allocated to the virtual machine (must be >= 1).
  int32 allocated_cpu_core_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Total RAM allocated to the virtual machine in bytes (must be > 0).
  int64 allocated_ram_bytes = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for pausing guest vCPU execution.
message PauseVmRequest {}

// Request message for resuming guest vCPU execution.
message ResumeVmRequest {}

// Request message for performing a warm ACPI reset of the virtual machine.
message ResetVmRequest {}

// Request message for performing a cold power-cycle reset of the virtual machine.
message HardResetVmRequest {}

// Request message for terminating the virtual machine hypervisor process.
message StopVmRequest {
  // When true, captures a final RAM and device state snapshot to the active quickboot target
  // before process termination so the next launch resumes instantly from this state.
  bool save_quickboot_snapshot = 1;
}

// Describes metadata, storage footprint, and host compatibility for a saved VM snapshot.
message Snapshot {
  // Unique snapshot identifier string (client-specified or server-generated on creation).
  string snapshot_id = 1;
  // Human-readable display label (falls back to `snapshot_id` when empty).
  string display_name = 2;
  // Optional free-form user description of the saved state.
  string description = 3;
  // Output only. UTC timestamp when the snapshot was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Total disk footprint of the snapshot in bytes.
  int64 size_bytes = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Hardware and hypervisor fingerprint used to verify cross-host compatibility.
  CompatibilityFingerprint compatibility = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. True if this snapshot is the active quickboot target loaded on launch
  // and overwritten when `HypervisorService.StopVm` executes with `save_quickboot_snapshot = true`.
  bool quickboot_target = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Captures host CPU, GPU renderer, and OS build identifiers required for safe snapshot restoration.
message CompatibilityFingerprint {
  // Output only. Host CPU architecture string (e.g., "x86_64", "arm64").
  string cpu_architecture = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Cryptographic hash of active host CPUID feature flags (AVX-512, SSE, etc.).
  string cpu_features_hash = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Android guest system image build identifier string.
  string system_image_build_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Emulator binary build identifier string.
  string emulator_build_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Active host GPU rendering backend (e.g., "gfxstream-vulkan", "swiftshader").
  string gpu_renderer = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. True if all fingerprint components are compatible with the current host.
  bool host_compatible = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for listing local snapshots.
message ListSnapshotsRequest {
  // When true, filters out snapshots whose `compatibility.host_compatible` is false.
  bool compatible_only = 1;
}

// Response message containing local snapshots matching the query filter.
message ListSnapshotsResponse {
  // Snapshots available on the local host disk.
  repeated Snapshot snapshots = 1;
}

// Request message for retrieving a single snapshot's metadata.
message GetSnapshotRequest {
  // Unique identifier of the snapshot to retrieve.
  string snapshot_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for updating mutable metadata of an existing local snapshot.
message UpdateSnapshotRequest {
  // Unique identifier of the local snapshot to update.
  string snapshot_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional new human-readable display label.
  optional string display_name = 2;
  // Optional new free-form user description.
  optional string description = 3;
}

// Creates a local VM snapshot (RAM + disk overlay) as a Long-Running Operation.
//
// `snapshot_id` specifies the unique identifier used for subsequent
// `GetSnapshot`, `UpdateSnapshot`, `RestoreSnapshot`, and `DeleteSnapshot` calls (e.g.,
// "pre_bug_state"). When omitted or empty, a unique filesystem-safe ID is
// auto-generated by the server. `display_name` is an optional human-readable
// label that defaults to `snapshot_id` when empty.
//
// Progress (`SnapshotOperationMetadata`) and completion (`Snapshot`) can be
// polled or awaited via the standard `google.longrunning.Operations` service.
message CreateSnapshotRequest {
  // Optional unique snapshot identifier string (e.g., "default_boot", "pre_login_state").
  // When omitted or empty, the server auto-generates a unique filesystem-safe identifier.
  string snapshot_id = 1 [(google.api.field_behavior) = OPTIONAL];
  // Optional human-readable display label (falls back to `snapshot_id` when empty).
  string display_name = 2;
  // Optional free-form user description of the saved state.
  string description = 3;
}

// Restores the VM to a previously saved snapshot state as a Long-Running Operation.
//
// The VM is paused, memory/disk state is reverted to `snapshot_id`, and execution
// resumes once the returned `google.longrunning.Operation` completes.
message RestoreSnapshotRequest {
  // Unique identifier of the local snapshot to restore.
  string snapshot_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Request message for deleting a local snapshot.
message DeleteSnapshotRequest {
  // Unique identifier of the local snapshot to delete.
  string snapshot_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// Response message for DeleteSnapshot.
message DeleteSnapshotResponse {}

// Request message for setting or clearing the active quickboot snapshot target.
message SetQuickbootTargetRequest {
  // Snapshot ID to load on boot and overwrite on quickboot-enabled shutdowns.
  // When omitted or empty, clears the quickboot target so the next launch performs a clean cold boot.
  optional string snapshot_id = 1;
}

// Response message for SetQuickbootTarget.
message SetQuickbootTargetResponse {}

// Request message for uploading a local snapshot archive to cloud storage.
message ExportSnapshotRequest {
  // Unique identifier of the local snapshot to export.
  string snapshot_id = 1 [(google.api.field_behavior) = REQUIRED];

  // Remote cloud storage upload target (exactly one must be set).
  oneof destination {
    // Cloud storage object URI (e.g., "gs://aemu-snapshots/avd_123/snap.tar.zst").
    string storage_uri = 2;
    // Pre-signed HTTP PUT URL for credential-free upload.
    string presigned_upload_url = 3;
  }
}

// Request message for downloading a snapshot archive from cloud storage to local disk.
message ImportSnapshotRequest {
  // Optional local snapshot identifier under which to register the downloaded archive.
  // When omitted or empty, the server auto-generates a unique filesystem-safe identifier.
  string snapshot_id = 1 [(google.api.field_behavior) = OPTIONAL];

  // Remote cloud storage download source (exactly one must be set).
  oneof source {
    // Cloud storage object URI (e.g., "gs://aemu-snapshots/golden_images/base.tar.zst").
    string storage_uri = 2;
    // Pre-signed HTTP GET URL for credential-free download.
    string presigned_download_url = 3;
  }
}

// Reports real-time progress telemetry for snapshot Long-Running Operations.
message SnapshotOperationMetadata {
  // Enumerates execution phases of a snapshot Long-Running Operation.
  enum Phase {
    // Default unspecified operation phase.
    PHASE_UNSPECIFIED = 0;
    // Quiescing hypervisor devices and allocating local memory/disk buffers.
    PREPARING = 1;
    // Reading, compressing, or transferring snapshot payload bytes.
    TRANSFERRING = 2;
  }
  // Output only. Active execution phase of the snapshot operation.
  Phase phase = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Completion progress percentage in range [0, 100].
  int32 progress_percent = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Identifier of the snapshot being created, restored, imported, or exported.
  string snapshot_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. Number of payload bytes processed or transferred so far (must be >= 0).
  int64 transferred_bytes = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Total expected snapshot payload size in bytes (must be >= 0).
  int64 total_bytes = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}
