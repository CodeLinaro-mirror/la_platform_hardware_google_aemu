syntax = "proto3";

package android.emulation.v2;

option go_package = "google.golang.org/aemu/protos/services/v2;v2pb";
option java_multiple_files = true;
option java_package = "com.android.emulator.v2";

import "google/api/field_behavior.proto";

// Observes and simulates device 3D pose, ambient environmental conditions,
// IMU sensor telemetry, and mechanical foldable/rollable postures.
//
// ARCHITECTURAL MODEL (TWO-LAYER PHYSICS & OVERRIDE DESIGN):
//   1. Physical Simulation Layer (`pose` + `environment` -> `imu`):
//      - Setting `pose` (3D rotation, position, velocity, ambient motion) or
//        `environment` (light, temperature, proximity, pressure, humidity, world
//        magnetic field, heart rate, wrist tilt) drives the emulator's rigid-body
//        physics engine (`PhysicalModel`).
//      - The server automatically synthesizes physically consistent, frame-transformed
//        `imu` readings (`accelerometer`, `gyroscope`, `magnetometer`, `orientation`)
//        for the Android guest OS. Rotating the phone via `pose.rotation_degrees`
//        naturally updates gravity on `accelerometer` (triggering Android screen
//        auto-rotation), angular velocity on `gyroscope`, and geomagnetic vectors on
//        `magnetometer`.
//   2. Raw Sensor Override Layer (`raw_overrides`):
//      - For low-level fault injection (e.g., testing 0g freefall or sensor fusion
//        edge cases), callers can pin individual HAL channels via `raw_overrides`,
//        bypassing physics synthesis until cleared (`clear_raw_overrides = true`).
//
// AVAILABILITY:
//   - Emulated devices: Full read/write simulation (`ACCESS_MODE_READ_WRITE`,
//     `FIDELITY_HARDWARE`) backed by the virtual sensor HAL (`libsensors.goldfish.so`).
//   - Physical devices (over ADB): Live telemetry observation (`ACCESS_MODE_READ_ONLY`,
//     `FIDELITY_HARDWARE`) via Android `SensorManager` and `WindowInfoTracker`.
//     Calling mutation RPCs (`UpdateSensorsState`, `StreamSensorsUpdates`,
//     `UpdatePostureState`) on a read-only physical device fails with `PERMISSION_DENIED`.
service SensorsService {
  // Returns the current snapshot of device pose, ambient environment, and live IMU readings.
  rpc GetSensorsState(GetSensorsStateRequest) returns (SensorsState);

  // Streams real-time snapshots of device pose, environment, and live IMU telemetry.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamSensorsStateRequest`.
  //   2. Server immediately emits the current `SensorsState` snapshot as the first message.
  //   3. Server pushes subsequent `SensorsState` snapshots as pose, environment, or IMU values update.
  //   4. High-frequency IMU updates are coalesced under client backpressure.
  //   5. Client cancels the RPC context to unsubscribe.
  rpc StreamSensorsState(StreamSensorsStateRequest)
      returns (stream SensorsState);

  // Partially or fully updates simulated 3D pose, ambient environment, or raw sensor overrides.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Out-of-range sensor or pose measurement.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc UpdateSensorsState(UpdateSensorsStateRequest)
      returns (SensorsState);

  // Continuously streams high-frequency client pose/environment updates (e.g., interactive 3D gizmo scrubbing).
  //
  // STREAM LIFECYCLE:
  //   1. Client opens client-streaming RPC and sends `UpdateSensorsStateRequest` messages.
  //   2. Server applies each partial update to the physics model / sensor HAL in arrival order.
  //   3. Client half-closes the stream to finish and receive `StreamSensorsUpdatesResponse`.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Out-of-range measurement.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc StreamSensorsUpdates(stream UpdateSensorsStateRequest)
      returns (StreamSensorsUpdatesResponse);

  // Returns the current foldable posture, multi-hinge angles, and rollable display states.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: Device does not support foldable/rollable postures (`SensorsCapabilities.posture` is unset).
  rpc GetPostureState(GetPostureStateRequest) returns (PostureState);

  // Streams real-time posture, hinge angle, and rollable extension updates as the device folds or unrolls.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamPostureStateRequest`.
  //   2. Server immediately sends the current `PostureState` snapshot as the first message.
  //   3. Server pushes subsequent `PostureState` messages whenever posture, hinge angles, or rollables change.
  //   4. Client cancels the RPC context to unsubscribe.
  rpc StreamPostureState(StreamPostureStateRequest)
      returns (stream PostureState);

  // Updates the foldable posture, individual hinge angles, or rollable extension percentages.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Angle outside supported bounds or unsupported `PostureType` / hinge ID.
  //   - FAILED_PRECONDITION: Device does not support foldable/rollable postures.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc UpdatePostureState(UpdatePostureStateRequest)
      returns (PostureState);
}

// Identifies hardware and environmental sensor channels exposed by the sensor subsystem.
enum SensorType {
  // Default unspecified sensor type.
  SENSOR_TYPE_UNSPECIFIED = 0;
  // Tri-axis linear acceleration including gravity in m/s^2 (Android TYPE_ACCELEROMETER).
  SENSOR_TYPE_ACCELEROMETER = 1;
  // Tri-axis angular velocity in rad/s (Android TYPE_GYROSCOPE).
  SENSOR_TYPE_GYROSCOPE = 2;
  // Tri-axis ambient geomagnetic field in micro-Tesla (Android TYPE_MAGNETIC_FIELD).
  SENSOR_TYPE_MAGNETOMETER = 3;
  // Device orientation Euler angles (Azimuth, Pitch, Roll) in degrees (Android TYPE_ORIENTATION).
  SENSOR_TYPE_ORIENTATION = 4;
  // Ambient room temperature in degrees Celsius (Android TYPE_AMBIENT_TEMPERATURE).
  SENSOR_TYPE_AMBIENT_TEMPERATURE = 5;
  // Object proximity distance from the front display surface in centimeters (Android TYPE_PROXIMITY).
  SENSOR_TYPE_PROXIMITY = 6;
  // Ambient illumination level in SI lux units (Android TYPE_LIGHT).
  SENSOR_TYPE_LIGHT = 7;
  // Atmospheric pressure in hectopascals / millibars (Android TYPE_PRESSURE).
  SENSOR_TYPE_PRESSURE = 8;
  // Relative ambient air humidity percentage in range [0.0, 100.0] (Android TYPE_RELATIVE_HUMIDITY).
  SENSOR_TYPE_RELATIVE_HUMIDITY = 9;
  // User heart rate in beats per minute (Android TYPE_HEART_RATE).
  SENSOR_TYPE_HEART_RATE = 10;
  // Four-channel color ambient light sensor (Red, Green, Blue, Clear) in lux.
  SENSOR_TYPE_RGBC_LIGHT = 11;
  // WearOS wrist tilt gesture detector state in range [0.0, 1.0].
  SENSOR_TYPE_WRIST_TILT = 12;
  // Mechanical hinge angle sensor in degrees [0.0, 360.0] (Android TYPE_HINGE_ANGLE).
  SENSOR_TYPE_HINGE_ANGLE = 13;
  // Uncalibrated tri-axis linear acceleration in m/s^2 (Android TYPE_ACCELEROMETER_UNCALIBRATED).
  SENSOR_TYPE_ACCELEROMETER_UNCALIBRATED = 14;
  // Uncalibrated tri-axis angular velocity in rad/s (Android TYPE_GYROSCOPE_UNCALIBRATED).
  SENSOR_TYPE_GYROSCOPE_UNCALIBRATED = 15;
  // Uncalibrated tri-axis magnetic field in micro-Tesla (Android TYPE_MAGNETIC_FIELD_UNCALIBRATED).
  SENSOR_TYPE_MAGNETOMETER_UNCALIBRATED = 16;
}

// Classifies discrete mechanical postures for foldable and multi-screen form factors.
enum PostureType {
  // Default unspecified posture state.
  POSTURE_TYPE_UNSPECIFIED = 0;
  // Device folded completely shut (0 degrees; inner display off).
  POSTURE_TYPE_CLOSED = 1;
  // Device partially opened in tabletop/laptop posture (~90 degrees).
  POSTURE_TYPE_HALF_OPENED = 2;
  // Device unfolded completely flat (~180 degrees).
  POSTURE_TYPE_OPENED = 3;
  // Device folded backwards beyond 180 degrees (~360 degrees wraparound).
  POSTURE_TYPE_FLIPPED = 4;
  // Device propped up in inverted-V tent posture.
  POSTURE_TYPE_TENT = 5;
}

// Specifies the physical hinge fold axis orientation of a foldable device.
enum FoldAxis {
  // Default unspecified fold axis.
  FOLD_AXIS_UNSPECIFIED = 0;
  // Horizontal fold axis (clamshell/flip phones that fold top-to-bottom).
  FOLD_AXIS_HORIZONTAL = 1;
  // Vertical fold axis (book-style foldables that fold left-to-right).
  FOLD_AXIS_VERTICAL = 2;
}

// Controls whether physical pose and hinge transitions occur instantaneously or interpolate smoothly over time.
enum TransitionMode {
  // Default unspecified transition mode (server applies smooth physics interpolation).
  TRANSITION_MODE_UNSPECIFIED = 0;
  // Instantaneous state jump (`PhysicalInterpolation::kStep`); zero transient gyroscope angular velocity.
  TRANSITION_MODE_STEP = 1;
  // Physically interpolated trajectory over time (`PhysicalInterpolation::kSmooth`); generates
  // realistic transient gyroscope angular velocity and linear acceleration curves during motion.
  TRANSITION_MODE_SMOOTH = 2;
}

// Request message for querying current hardware sensor values.
message GetSensorsStateRequest {}

// Request message for subscribing to sensor telemetry updates.
message StreamSensorsStateRequest {}

// Response message for completing a client-streaming sensor update session.
message StreamSensorsUpdatesResponse {}

// Represents a 3D vector in standard Android sensor coordinates (+X right, +Y up, +Z out of screen).
message Vector3f {
  // X-axis component (+X points right along the short edge in natural portrait; defaults to 0.0).
  float x = 1;
  // Y-axis component (+Y points up along the long edge in natural portrait; defaults to 0.0).
  float y = 2;
  // Z-axis component (+Z points out of the front display face toward the user; defaults to 0.0).
  float z = 3;
}

// Represents 4-channel ambient color light intensity measurements in SI lux units.
message RgbcLight {
  // Red spectral channel intensity in lux (must be >= 0.0; defaults to 0.0).
  float red = 1;
  // Green spectral channel intensity in lux (must be >= 0.0; defaults to 0.0).
  float green = 2;
  // Blue spectral channel intensity in lux (must be >= 0.0; defaults to 0.0).
  float blue = 3;
  // Unfiltered clear broadband channel intensity in lux (must be >= 0.0; defaults to 0.0).
  float clear = 4;
}

// Describes the 3D rigid-body pose and motion of the device in world space (`InertialModel`).
//
// Updating `DevicePose` drives the emulator's rigid-body physics engine and automatically
// synthesizes frame-consistent readings across `ImuTelemetry` (`accelerometer`, `gyroscope`,
// `magnetometer`, and `orientation_degrees`).
message DevicePose {
  // 3D device rotation Euler angles in degrees:
  //   x = Pitch [-180.0, 180.0] (positive when top edge tilts toward ground)
  //   y = Yaw / Azimuth [0.0, 360.0) (0 = North, 90 = East, 180 = South, 270 = West)
  //   z = Roll [-90.0, 90.0] (positive when left edge tilts toward sky)
  optional Vector3f rotation_degrees = 1;
  // 3D device translation in world space in meters (x, y, z).
  optional Vector3f position_meters = 2;
  // 3D device linear velocity in meters per second (x, y, z).
  optional Vector3f velocity_meters_per_second = 3;
  // Ambient motion / natural hand tremor intensity bound in meters (must be >= 0.0).
  optional float ambient_motion = 4;
}

// Describes ambient environmental and biometric conditions surrounding the device (`AmbientEnvironment` & `BodyModel`).
message AmbientEnvironment {
  // Ambient illumination intensity in SI lux units (must be >= 0.0; e.g., 0.0 pitch dark, 400.0 office).
  optional float light_lux = 1;
  // Four-channel color ambient light intensities (Red, Green, Blue, Clear) in lux.
  optional RgbcLight rgbc_light = 2;
  // Object distance from the front proximity sensor in centimeters (must be >= 0.0; 0.0 = near/covered).
  optional float proximity_centimeters = 3;
  // Ambient air temperature in degrees Celsius (°C).
  optional float ambient_temperature_celsius = 4;
  // Atmospheric pressure in hectopascals / millibars (e.g., 1013.25 at sea level; must be >= 0.0).
  optional float pressure_hpa = 5;
  // Relative ambient humidity percentage in range [0.0, 100.0].
  optional float relative_humidity_percent = 6;
  // Ambient geomagnetic field vector in world coordinates in micro-Tesla (μT; e.g., {0.0, 5.9, -48.4}).
  optional Vector3f magnetic_field_ut = 7;
  // User heart rate in beats per minute (must be >= 0.0).
  optional float heart_rate_bpm = 8;
  // WearOS wrist tilt gesture state in range [0.0, 1.0] (1.0 triggers tilt-to-wake).
  optional float wrist_tilt = 9;
}

// Live IMU sensor readings delivered to the Android guest OS (`libsensors.goldfish.so`).
//
// Unless overridden via `RawSensorOverrides`, these values are automatically synthesized
// in real time from `DevicePose` and `AmbientEnvironment`:
//   - `accelerometer` = q^-1 * (a_linear - g_world)
//   - `gyroscope`     = q^-1 * w_angular
//   - `magnetometer`  = q^-1 * B_world
//   - `orientation_degrees` = EulerXYZ(q)
message ImuTelemetry {
  // Output only. Tri-axis linear acceleration including gravity in m/s^2 (resting flat face-up = {0.0, 0.0, 9.81}).
  Vector3f accelerometer = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Tri-axis angular velocity in radians per second around (+X, +Y, +Z).
  Vector3f gyroscope = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Tri-axis geomagnetic field strength in device coordinates in micro-Tesla (μT).
  Vector3f magnetometer = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Device orientation Euler angles in degrees (x = Azimuth, y = Pitch, z = Roll).
  Vector3f orientation_degrees = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Uncalibrated tri-axis linear acceleration in m/s^2.
  Vector3f accelerometer_uncalibrated = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Uncalibrated tri-axis angular velocity in rad/s.
  Vector3f gyroscope_uncalibrated = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Uncalibrated tri-axis magnetic field in micro-Tesla (μT).
  Vector3f magnetometer_uncalibrated = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Lists any sensor channels currently pinned by `RawSensorOverrides` rather than physics synthesis.
  repeated SensorType active_overrides = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Explicit per-channel HAL overrides for low-level fault injection and sensor fusion testing.
//
// Pinning a channel here bypasses physics synthesis for that specific sensor until cleared
// via `UpdateSensorsStateRequest.clear_raw_overrides = true` (or until a physical target state
// transition resets overrides).
message RawSensorOverrides {
  // Override raw `SENSOR_TYPE_ACCELEROMETER` in m/s^2 (e.g., {0, 0, 0} for 0g freefall testing).
  optional Vector3f accelerometer = 1;
  // Override raw `SENSOR_TYPE_GYROSCOPE` in rad/s.
  optional Vector3f gyroscope = 2;
  // Override raw `SENSOR_TYPE_MAGNETOMETER` in micro-Tesla (μT).
  optional Vector3f magnetometer = 3;
  // Override raw `SENSOR_TYPE_ORIENTATION` Euler angles in degrees.
  optional Vector3f orientation_degrees = 4;
  // Override raw `SENSOR_TYPE_ACCELEROMETER_UNCALIBRATED` in m/s^2.
  optional Vector3f accelerometer_uncalibrated = 5;
  // Override raw `SENSOR_TYPE_GYROSCOPE_UNCALIBRATED` in rad/s.
  optional Vector3f gyroscope_uncalibrated = 6;
  // Override raw `SENSOR_TYPE_MAGNETOMETER_UNCALIBRATED` in micro-Tesla (μT).
  optional Vector3f magnetometer_uncalibrated = 7;
}

// Snapshot of device 3D pose, ambient environment, and live IMU sensor telemetry.
message SensorsState {
  // Output only. Monotonic timestamp in nanoseconds (`CLOCK_MONOTONIC`) aligned with audio/video.
  int64 timestamp_nanos = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Current 3D rigid-body pose and motion of the device in world space.
  DevicePose pose = 2;
  // Current ambient environmental and biometric conditions surrounding the device.
  AmbientEnvironment environment = 3;
  // Output only. Live IMU readings delivered to the Android guest OS.
  ImuTelemetry imu = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for partially or fully mutating device pose, environment, or raw sensor overrides.
//
// Only fields explicitly set on the wire are modified; omitted fields leave current state untouched.
message UpdateSensorsStateRequest {
  // Updates 3D device pose/motion and automatically synthesizes coherent IMU readings.
  optional DevicePose pose = 1;
  // Updates ambient environmental and biometric parameters.
  optional AmbientEnvironment environment = 2;
  // Pins specific raw IMU HAL channels for fault-injection testing.
  optional RawSensorOverrides raw_overrides = 3;
  // If true, clears all active `RawSensorOverrides` and restores physics synthesis across all IMU channels.
  optional bool clear_raw_overrides = 4;
  // Controls whether pose changes happen instantaneously (`TRANSITION_MODE_STEP`) or smoothly
  // interpolate over physical time (`TRANSITION_MODE_SMOOTH`, default).
  TransitionMode transition = 5;
}

// Request message for querying the current posture state.
message GetPostureStateRequest {}

// Request message for subscribing to posture state changes.
message StreamPostureStateRequest {}

// Describes the angle of an individual mechanical hinge on a foldable or multi-fold device.
message HingeState {
  // Zero-based hinge identifier (0 for primary hinge; tri-fold devices use 0 and 1).
  int32 hinge_id = 1;
  // Physical hinge angle in degrees within range [0.0, 360.0] (0.0 represents closed).
  float angle_degrees = 2;
}

// Describes the extension percentage of an individual rollable or slidable display axis.
message RollableState {
  // Zero-based rollable axis identifier (0 for primary rollable display).
  int32 rollable_id = 1;
  // Display extension percentage within range [0.0, 100.0] (0.0 = fully retracted, 100.0 = fully unrolled).
  float extension_percent = 2;
}

// Represents the active mechanical posture, multi-hinge angles, and rollable extension states.
//
// --- Server-Side Coupling (`posture` vs. `hinges`) ---
// When updating posture via `UpdatePostureState`:
//   - Setting `hinges` automatically derives the corresponding discrete `posture` enum value
//     based on the angle intervals advertised in `CapabilitiesService.GetDeviceCapabilities().sensors.posture.posture_definitions`
//     (e.g., 90.0° -> `POSTURE_TYPE_HALF_OPENED`, 180.0° -> `POSTURE_TYPE_OPENED`).
//   - Setting `posture` alone automatically snaps the device's hinges to that posture's
//     `default_angle_degrees`.
message PostureState {
  // Active discrete foldable posture classification.
  PostureType posture = 1;
  // Physical angles for each mechanical hinge on the device (ordered by `hinge_id`).
  repeated HingeState hinges = 2;
  // Extension percentages for each rollable/slidable display axis (ordered by `rollable_id`).
  repeated RollableState rollables = 3;
  // Output only. Monotonic timestamp in nanoseconds (`CLOCK_MONOTONIC`) aligned with audio/video.
  int64 timestamp_nanos = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for partially or fully mutating posture, hinge angles, or rollable states.
//
// Only fields explicitly set on the wire are modified; omitted fields leave current mechanical state untouched.
message UpdatePostureStateRequest {
  // Desired discrete foldable posture classification (automatically snaps hinges to default angles).
  optional PostureType posture = 1;
  // Desired physical angles for one or more hinges (identified by `hinge_id`).
  repeated HingeState hinges = 2;
  // Desired extension percentages for one or more rollable axes (identified by `rollable_id`).
  repeated RollableState rollables = 3;
  // Controls whether mechanical folding/unrolling occurs instantaneously (`TRANSITION_MODE_STEP`)
  // or smoothly interpolates over physical time (`TRANSITION_MODE_SMOOTH`, default).
  TransitionMode transition = 4;
}
