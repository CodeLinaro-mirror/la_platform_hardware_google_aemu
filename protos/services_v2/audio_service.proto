syntax = "proto3";

package android.emulation.v2;

option go_package = "google.golang.org/protobuf/types/known/emulation/v2;emulationv2";
option java_multiple_files = true;
option java_package = "com.android.emulator.v2";

import "common.proto";
import "google/api/field_behavior.proto";

// Controls the virtual microphone mixer and streams uncompressed PCM audio between
// the host and the device's microphone and speaker endpoints.
//
// AVAILABILITY:
//   The two directions are independent and are advertised separately by
//   `AudioCapabilities.microphone_profile` and `AudioCapabilities.speaker_profile`.
//   Emulated devices generally offer both. Physical devices reached over ADB
//   typically offer speaker capture only, since there is no virtual microphone
//   HAL to write into. Inspect the capability before opening a stream or mutating
//   microphone state.
//
//   The virtual wired headset jack is advertised separately by
//   `AudioCapabilities.supports_wired_headset`; see `UpdateAudioState`.
//
//   This service is also independent of `RtcService`. RtcService carries encoded
//   Opus audio inside a peer connection and is the right choice for human
//   playback; AudioService delivers raw PCM and is the right choice for
//   programmatic consumers (speech recognition, waveform assertions, audio
//   diffing) that need unencoded samples. Either may be used without the other,
//   and when `AudioCapabilities.max_concurrent_microphone_streams` is greater
//   than 1, WebRTC and programmatic gRPC microphone streams are mixed together.
service AudioService {
  // Returns the current virtual microphone mixer and audio endpoint state.
  //
  // Recommended client deadline: >= 500ms.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: The audio subsystem is disabled (`DeviceCapabilities.audio` is unset).
  rpc GetAudioState(GetAudioStateRequest) returns (AudioState);

  // Streams real-time virtual microphone mixer and guest capture state updates.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamAudioStateRequest`.
  //   2. Server immediately sends the current `AudioState` snapshot as the first message.
  //   3. Server pushes subsequent `AudioState` snapshots whenever mute state, channel gain,
  //      attached mixer inputs, guest microphone capture activity, or the wired headset
  //      changes.
  //   4. Client cancels the RPC context to unsubscribe.
  //
  // Expected gRPC status codes:
  //   - FAILED_PRECONDITION: The audio subsystem is disabled (`DeviceCapabilities.audio` is unset).
  rpc StreamAudioState(StreamAudioStateRequest) returns (stream AudioState);

  // Updates virtual microphone mute state, per-channel mixer controls, or the wired headset.
  //
  // Setting `microphone_muted = true` silences all microphone audio delivered to the guest OS
  // by feeding virtual-clock-paced PCM silence while keeping attached WebRTC and gRPC streams
  // connected. The host machine's physical microphone is the `"host"` entry in
  // `microphone_inputs`; it is muted by default unless the emulator was launched with host
  // audio input allowed. Setting `microphone_inputs { source_id: "host" muted: true }` detaches
  // only that microphone, while WebRTC and gRPC audio injection continue.
  //
  // Setting `wired_headset` plugs a virtual wired headset into the device, or unplugs it. The
  // emulator signals the Linux jack switches (`SW_HEADPHONE_INSERT`, `SW_MICROPHONE_INSERT`) to
  // the guest, as a real headset jack does. Apps observe the headset only if the system image's
  // audio policy declares wired headset devices; see `AudioCapabilities.supports_wired_headset`.
  //
  // Recommended client deadline: >= 500ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Empty `source_id` or out-of-range `gain` (outside [0.0, 4.0]) in
  //     `microphone_inputs`, or `wired_headset` set to `WIRED_HEADSET_UNSPECIFIED`.
  //   - NOT_FOUND: `source_id` in `microphone_inputs` does not match `"host"` or any currently
  //     attached `MicrophoneInput`.
  //   - PERMISSION_DENIED: Caller lacks write access (`ACCESS_MODE_READ_ONLY`).
  //   - FAILED_PRECONDITION: The audio subsystem is disabled; `microphone_muted` or
  //     `microphone_inputs` is set but this device has no controllable virtual microphone
  //     endpoint (`AudioCapabilities.microphone_profile` is unset); or `wired_headset` is set but
  //     `AudioCapabilities.supports_wired_headset` is false.
  rpc UpdateAudioState(UpdateAudioStateRequest) returns (AudioState);

  // Injects a complete, self-contained PCM audio clip into the device's microphone input
  // in a single unary call, paced automatically by the server according to its sample rate.
  //
  // Ideal for AI agents, automated test scripts, and gRPC-Web clients that want to inject
  // a pre-recorded voice utterance or tone without managing a client-side streaming loop.
  //
  // Recommended client deadline: >= clip duration + 1000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Unsupported sample rate, channel count, sample format, or reserved
  //     `source_id` (`"host"` or `"webrtc"`).
  //   - ALREADY_EXISTS: Another stream with the same `source_id` is active, or exclusive
  //     single-source microphone capacity (`max_concurrent_microphone_streams == 1`) is occupied.
  //   - RESOURCE_EXHAUSTED: Maximum concurrent microphone mixer stream capacity
  //     (`AudioCapabilities.max_concurrent_microphone_streams`) reached.
  //   - PERMISSION_DENIED: Caller lacks write access (`ACCESS_MODE_READ_ONLY`).
  //   - FAILED_PRECONDITION: This device has no injectable microphone endpoint
  //     (`AudioCapabilities.microphone_profile` is unset), or the audio subsystem is disabled.
  rpc InjectAudioClip(AudioChunk) returns (InjectAudioClipResponse);

  // Injects client PCM audio chunks into the device's microphone input via a continuous stream.
  //
  // STREAM LIFECYCLE:
  //   1. Client opens client-streaming RPC and sends `AudioChunk` messages paced by `timestamp_nanos`.
  //   2. Server rebases client timestamps onto `CLOCK_MONOTONIC` and feeds the guest microphone HAL.
  //   3. Client half-closes the stream or cancels context to stop microphone injection.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Unsupported sample rate, channel count, sample format, or reserved
  //     `source_id` (`"host"` or `"webrtc"`).
  //   - ALREADY_EXISTS: Another stream with the same `source_id` is active, or exclusive
  //     single-source microphone capacity (`max_concurrent_microphone_streams == 1`) is occupied.
  //   - RESOURCE_EXHAUSTED: Maximum concurrent microphone mixer stream capacity
  //     (`AudioCapabilities.max_concurrent_microphone_streams`) reached.
  //   - PERMISSION_DENIED: Caller lacks write access (`ACCESS_MODE_READ_ONLY`).
  //   - FAILED_PRECONDITION: This device has no injectable microphone endpoint
  //     (`AudioCapabilities.microphone_profile` is unset), or the audio subsystem is disabled.
  rpc StreamMicrophoneAudio(stream AudioChunk) returns (StreamMicrophoneAudioResponse);

  // Streams audio output emitted by the device's speaker mixer.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamSpeakerAudioRequest`.
  //   2. Server immediately begins pushing `AudioChunk` buffers as guest audio is mixed.
  //   3. Under client backpressure, the server drops oldest unconsumed audio buffers to preserve real-time latency.
  //   4. Client MUST cancel the RPC context when finished to release host audio mixer tap resources.
  //
  // To record audio triggered by a UI action (e.g., clicking a button) without
  // clipping initial playback, open `StreamSpeakerAudio` BEFORE dispatching the
  // input event, then align/trim recorded frames using `timestamp_nanos`
  // (`CLOCK_MONOTONIC`, shared with `InputEvent` and `Screenshot`).
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Requested sample rate, channel count, or format is not supported.
  //   - FAILED_PRECONDITION: This device has no capturable speaker endpoint
  //     (`AudioCapabilities.speaker_profile` is unset), or the audio subsystem is disabled.
  rpc StreamSpeakerAudio(StreamSpeakerAudioRequest) returns (stream AudioChunk);
}

// Encapsulates a contiguous buffer of uncompressed PCM audio samples and its format metadata.
message AudioChunk {
  // Interleaved raw PCM sample buffer (e.g., Stereo = [L0, R0, L1, R1, ...]).
  bytes pcm_data = 1 [(google.api.field_behavior) = REQUIRED];
  // Sampling frequency in Hertz (e.g., 16000, 44100, 48000; must be > 0).
  int32 sample_rate_hz = 2 [(google.api.field_behavior) = REQUIRED];
  // Number of interleaved audio channels (e.g., 1 = Mono, 2 = Stereo; must be >= 1).
  int32 channel_count = 3 [(google.api.field_behavior) = REQUIRED];
  // Binary sample encoding format (PCM16_BIT little-endian or F32_BIT float).
  SampleFormat format = 4 [(google.api.field_behavior) = REQUIRED];
  // Monotonic timestamp in nanoseconds (`CLOCK_MONOTONIC`) for the first sample in `pcm_data`.
  // Populated by the server on speaker capture streams; optional on microphone injection streams.
  int64 timestamp_nanos = 5;
  // Optional logical caller/channel identifier surfaced in `AudioState.microphone_inputs`
  // (e.g., `"voice-agent"`). Must not be `"host"` or `"webrtc"`, which name the host machine's
  // microphone and the WebRTC clients' microphone. When unset or empty, defaults to the
  // `x-client-id` gRPC metadata header if present, or a server-generated identifier.
  optional string source_id = 6;
}

// Request message for querying current audio and virtual microphone mixer state.
message GetAudioStateRequest {}

// Request message for subscribing to audio and virtual microphone mixer state updates.
message StreamAudioStateRequest {}

// Describes a single audio input channel attached to the virtual microphone mixer.
message MicrophoneInput {
  // Classifies the audio producer feeding a virtual microphone mixer channel.
  enum Kind {
    // Default unspecified input kind.
    KIND_UNSPECIFIED = 0;
    // Host machine's physical audio capture backend (always uses `source_id = "host"`).
    HOST = 1;
    // Unary PCM clip injection via `AudioService.InjectAudioClip`.
    GRPC_CLIP = 2;
    // Continuous PCM stream injection via `AudioService.StreamMicrophoneAudio`.
    GRPC_STREAM = 3;
    // Inbound Opus microphone audio from `RtcService` WebRTC peer connections. All connected
    // sessions that offer microphone audio share one input with `source_id = "webrtc"` and are
    // mixed into it; it is silent while no session has a microphone track attached.
    WEBRTC = 4;
  }

  // Mixer channel identifier (`"host"` for the built-in host physical microphone channel,
  // `"webrtc"` for the input shared by all WebRTC sessions, or caller/server-assigned ID for
  // gRPC streams).
  string source_id = 1;
  // Output only. Category of audio producer feeding this input channel.
  Kind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When true, this individual input channel contributes silence (0.0) to the mixer without
  // disconnecting the underlying stream or peer connection.
  bool muted = 3;
  // Linear amplitude multiplier in range [0.0, 4.0] applied before mixing (1.0 = unity gain).
  float gain = 4;
}

// Partial update targeting an individual channel in the virtual microphone mixer.
message MicrophoneInputUpdate {
  // Target mixer channel identifier (e.g., `"host"`, `"webrtc"`, or a gRPC `source_id`).
  string source_id = 1 [(google.api.field_behavior) = REQUIRED];
  // When set, mutes or unmutes this specific input channel.
  optional bool muted = 2;
  // When set, updates this input channel's linear gain multiplier in range [0.0, 4.0] (1.0 = unity).
  optional float gain = 3;
}

// Represents the runtime state of the virtual microphone mixer and audio endpoints.
//
// The host machine's physical microphone is the `"host"` entry in `microphone_inputs`. It is
// muted by default unless the emulator was launched with host audio input allowed; unmute it
// with `UpdateAudioStateRequest.microphone_inputs { source_id: "host" muted: false }`.
message AudioState {
  // Master virtual microphone mute: when true, the guest HAL always receives virtual-clock-paced
  // PCM silence regardless of attached `microphone_inputs`.
  bool microphone_muted = 1;
  // Output only. True when an Android guest application currently has a microphone capture
  // stream (`AudioRecord`) open and active.
  bool microphone_in_use_by_guest = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Input channels currently attached to the virtual microphone mixer (ordered with
  // `"host"` first when audio input hardware is present, followed by active injected streams).
  repeated MicrophoneInput microphone_inputs = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Output only. Monotonic timestamp in nanoseconds (`CLOCK_MONOTONIC`) aligned with audio/video.
  int64 timestamp_nanos = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // What is plugged into the virtual wired headset jack. `WIRED_HEADSET_UNSPECIFIED` when
  // `AudioCapabilities.supports_wired_headset` is false. Reports the jack state the emulator
  // signals to the guest, not whether the guest's audio policy accepted the headset.
  WiredHeadset wired_headset = 5;
}

// Request message for partially mutating virtual microphone mute state, mixer channel controls,
// and the wired headset.
//
// Only fields explicitly set on the wire are modified; omitted fields leave current state untouched.
message UpdateAudioStateRequest {
  // Master virtual microphone mute toggle. Setting `true` injects steady virtual-clock-paced
  // silence into the guest across all inputs (host, WebRTC, and gRPC).
  optional bool microphone_muted = 1;
  // Per-channel mute and gain updates keyed by `source_id`, applied in order. Use
  // `source_id: "host"` for the host machine's physical microphone.
  repeated MicrophoneInputUpdate microphone_inputs = 2;
  // When set, plugs the given wired headset into the virtual jack, or unplugs it with
  // `WIRED_HEADSET_DISCONNECTED`. Requires `AudioCapabilities.supports_wired_headset`.
  optional WiredHeadset wired_headset = 3;
}

// What is plugged into the device's virtual wired headset jack.
//
// The emulator signals the jack to the guest through the Linux switches `SW_HEADPHONE_INSERT` and
// `SW_MICROPHONE_INSERT`, which the guest's `WiredAccessoryManager` reads.
enum WiredHeadset {
  // Default unspecified value. Reported when the device has no virtual wired headset jack, and
  // rejected with INVALID_ARGUMENT in `UpdateAudioStateRequest`.
  WIRED_HEADSET_UNSPECIFIED = 0;
  // Nothing is plugged into the jack.
  WIRED_HEADSET_DISCONNECTED = 1;
  // Headphones without a microphone (`SW_HEADPHONE_INSERT`); Android reports
  // `AudioDeviceInfo.TYPE_WIRED_HEADPHONES`.
  WIRED_HEADSET_WITHOUT_MICROPHONE = 2;
  // A headset with a microphone (`SW_HEADPHONE_INSERT` and `SW_MICROPHONE_INSERT`); Android
  // reports `AudioDeviceInfo.TYPE_WIRED_HEADSET`.
  WIRED_HEADSET_WITH_MICROPHONE = 3;
}

// Response message for InjectAudioClip.
message InjectAudioClipResponse {
  // Total duration of injected audio in milliseconds.
  uint64 duration_ms = 1;
}

// Response message for StreamMicrophoneAudio.
message StreamMicrophoneAudioResponse {}

// Configures sample rate, channel layout, and encoding format for speaker audio capture.
//
// Every field is a request for server-side conversion of the mixer output. Unset
// fields stream the device mixer's native value with no conversion. Requesting a
// combination absent from `AudioCapabilities.speaker_profile` fails with
// INVALID_ARGUMENT rather than silently falling back.
message StreamSpeakerAudioRequest {
  // Target output sample rate in Hertz. When unset, streams at the device mixer's native rate without resampling.
  optional int32 sample_rate_hz = 1;
  // Target output sample encoding format. When unset, streams in the device mixer's native format.
  optional SampleFormat format = 2;
  // Target output channel count (1 = Mono, 2 = Stereo). When unset, streams the
  // mixer's native layout. Requesting 1 downmixes on the server, halving wire
  // bandwidth; prefer it for speech recognition, which discards the second
  // channel anyway. This matters most over ADB-forwarded and remote transports.
  optional int32 channel_count = 3;
}
