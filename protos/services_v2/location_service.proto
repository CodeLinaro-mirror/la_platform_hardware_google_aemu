syntax = "proto3";

package android.emulation.v2;

option go_package = "google.golang.org/protobuf/types/known/emulation/v2;emulationv2";
option java_multiple_files = true;
option java_package = "com.android.emulator.v2";

import "google/api/field_behavior.proto";

// Observes and injects WGS84 geographic coordinates and GNSS signal quality parameters.
service LocationService {
  // Returns the most recently sampled or injected GNSS location fix.
  //
  // Recommended client deadline: >= 500ms.
  rpc GetLocationState(GetLocationStateRequest) returns (LocationState);

  // Streams real-time GNSS location fixes as the simulated or physical location changes.
  //
  // STREAM LIFECYCLE:
  //   1. Client initiates RPC with `StreamLocationStateRequest`.
  //   2. Server immediately emits the current `LocationState` fix as the first message.
  //   3. Server pushes subsequent `LocationState` messages whenever GNSS coordinates or fix quality change.
  //   4. Client cancels the RPC context to unsubscribe.
  rpc StreamLocationState(StreamLocationStateRequest)
      returns (stream LocationState);

  // Partially or fully updates the device's simulated GNSS location fix.
  //
  // Recommended client deadline: >= 1000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: `latitude` outside `[-90.0, 90.0]`, `longitude` outside `[-180.0, 180.0]`,
  //     or negative `speed_meters_per_second`/`accuracy_meters`/`satellite_count`.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc UpdateLocationState(UpdateLocationStateRequest)
      returns (LocationState);

  // Uploads a sequence of GNSS route waypoints (e.g., GPX/KML playback) and plays them back on the
  // server at ~1 Hz GNSS HAL cadence without requiring client-side streaming timers.
  //
  // Replaces an in-progress route if one is already playing. Calling `UpdateLocationState`
  // cancels any active route playback and latches the new static fix.
  //
  // Recommended client deadline: >= 2000ms.
  //
  // Expected gRPC status codes:
  //   - INVALID_ARGUMENT: Empty `waypoints`, out-of-bounds coordinates, or `playback_speed_multiplier <= 0.0`.
  //   - PERMISSION_DENIED: Caller lacks write permission (`ACCESS_MODE_READ_ONLY`).
  rpc PlayRoute(PlayRouteRequest) returns (PlayRouteResponse);
}

// Request message for querying the current GNSS location fix.
message GetLocationStateRequest {}

// Request message for subscribing to GNSS location updates.
message StreamLocationStateRequest {}

// Represents a WGS84 geographic coordinate fix and associated GNSS signal quality metrics.
//
// --- Simulating Tunnel / Signal Loss vs Multipath Drift ---
//   - Complete GPS fix loss (e.g., inside a tunnel): set `satellite_count = 0`.
//   - GPS drift / urban multipath / tall structure degradation: increase `accuracy_meters`
//     (e.g., from 3.0m to 50.0m+) while keeping `satellite_count > 0`.
message LocationState {
  // WGS84 geodetic latitude in degrees within range [-90.0, 90.0] (positive north; defaults to 0.0).
  double latitude = 1;
  // WGS84 geodetic longitude in degrees within range [-180.0, 180.0] (positive east; defaults to 0.0).
  double longitude = 2;
  // Altitude above the WGS84 reference ellipsoid in meters (defaults to 0.0 sea level).
  double altitude_meters = 3;
  // Horizontal ground speed in meters per second (must be >= 0.0; defaults to 0.0 stationary).
  float speed_meters_per_second = 4;
  // Horizontal direction of travel in degrees clockwise from true north in range [0.0, 360.0) (defaults to 0.0).
  float bearing_degrees = 5;
  // Estimated horizontal accuracy radius in meters at 68% confidence (must be >= 0.0; defaults to 0.0).
  float accuracy_meters = 6;
  // Number of visible satellites used in NMEA GPGGA fix (must be >= 0; 0 simulates complete loss of GPS fix).
  int32 satellite_count = 7;
  // Output only. Monotonic timestamp in nanoseconds (`CLOCK_MONOTONIC`) when the fix was sampled.
  int64 timestamp_nanos = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for partially or fully updating the simulated GNSS location fix.
//
// Only fields explicitly set on the wire are modified; omitted fields leave
// the device's current location properties untouched. Setting a field to its
// zero value (e.g., `satellite_count = 0`) explicitly updates that property.
message UpdateLocationStateRequest {
  // WGS84 geodetic latitude in degrees within range [-90.0, 90.0].
  optional double latitude = 1;
  // WGS84 geodetic longitude in degrees within range [-180.0, 180.0].
  optional double longitude = 2;
  // Altitude above the WGS84 reference ellipsoid in meters.
  optional double altitude_meters = 3;
  // Horizontal ground speed in meters per second (must be >= 0.0).
  optional float speed_meters_per_second = 4;
  // Horizontal direction of travel in degrees clockwise from true north [0.0, 360.0).
  optional float bearing_degrees = 5;
  // Estimated horizontal accuracy radius in meters at 68% confidence (must be >= 0.0).
  optional float accuracy_meters = 6;
  // Number of visible satellites used in NMEA GPGGA fix (must be >= 0; 0 simulates complete loss of GPS fix).
  optional int32 satellite_count = 7;
}

// A single timed waypoint in a server-paced GNSS route playback sequence.
message RouteWaypoint {
  // Target location fix for this waypoint.
  UpdateLocationStateRequest location = 1 [(google.api.field_behavior) = REQUIRED];
  // Time offset in milliseconds from the previous waypoint (or from start for waypoint 0).
  // Defaults to 1000ms (1 Hz) when 0.
  uint64 delay_ms = 2;
}

// Request message for uploading and starting server-paced GNSS route playback.
message PlayRouteRequest {
  // Ordered sequence of route waypoints to play back.
  repeated RouteWaypoint waypoints = 1 [(google.api.field_behavior) = REQUIRED];
  // Playback speed multiplier (e.g., 1.0 = real-time, 2.0 = 2x speed). Defaults to 1.0 when unset or 0.0.
  float playback_speed_multiplier = 2;
  // When true, loops back to the first waypoint continuously until stopped or replaced.
  bool loop = 3;
}

// Response message for PlayRoute.
message PlayRouteResponse {}
