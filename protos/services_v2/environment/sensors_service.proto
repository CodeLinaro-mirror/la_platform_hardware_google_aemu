syntax = "proto3";

package android.emulation.v2.environment;

option java_multiple_files = true;
option java_package = "com.android.emulator.v2.environment";

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

// Manages sensors execution and interactions.
service SensorsService {
  rpc GetSensorsState(GetSensorsStateRequest) returns (SensorsState);
  // Streams the sensors state continuously.
  rpc StreamSensorsState(StreamSensorsStateRequest)
      returns (stream SensorsState);
  // Updates the sensors state.
  rpc UpdateSensorsState(UpdateSensorsStateRequest)
      returns (SensorsState);
  // Streams sensors updates bidirectionally.
  rpc StreamSensorsUpdates(stream UpdateSensorsStateRequest)
      returns (google.protobuf.Empty);
}

message GetSensorsStateRequest {}

message StreamSensorsStateRequest {}

message Vector3f {
  float x = 1;
  // The y.
  float y = 2;
  // The z.
  float z = 3;
}

message RgbcLight {
  float red = 1;
  // The green.
  float green = 2;
  // The blue.
  float blue = 3;
  // The clear.
  float clear = 4;
}

message UncalibratedVector3f {
  // Raw uncalibrated measurement without bias compensation.
  Vector3f measurement = 1;
  // Estimated bias along each axis.
  Vector3f bias = 2;
}

message SensorsState {

  // Monotonic timestamp (CLOCK_MONOTONIC) aligned with audio/video.
  int64 timestamp_nanos = 1;
  // Accelerometer in m/s^2.
  Vector3f accelerometer = 2;
  // Gyroscope in rad/s.
  Vector3f gyroscope = 3;
  // Magnetometer in μT.
  Vector3f magnetometer = 4;
  // Orientation (Azimuth, Pitch, Roll in degrees).
  Vector3f orientation_degrees = 5;
  // Ambient temperature in °C.
  float ambient_temperature_celsius = 6;
  // Proximity distance in cm.
  float proximity_centimeters = 7;
  // Ambient light in lux.
  float light_lux = 8;
  // Atmospheric pressure in hPa / millibar (e.g. 1013.25).
  float pressure_hpa = 9;
  // Relative humidity percentage.
  float relative_humidity_percent = 10;
  // Heart rate in beats per minute (bpm).
  float heart_rate_bpm = 11;
  // Color ambient light channel_count (Red, Green, Blue, Clear).
  RgbcLight rgbc_light = 12;
  // WearOS wrist tilt gesture value [0.0, 1.0].
  float wrist_tilt = 13;
  // Uncalibrated accelerometer in m/s^2 (raw measurement + estimated bias).
  UncalibratedVector3f accelerometer_uncalibrated = 14;
  // Uncalibrated gyroscope in rad/s (raw measurement + estimated bias).
  UncalibratedVector3f gyroscope_uncalibrated = 15;
  // Uncalibrated magnetometer in μT (raw measurement + estimated bias).
  UncalibratedVector3f magnetometer_uncalibrated = 16;
  // Compass heading relative to true north in degrees [0.0, 360.0].
  float heading_degrees = 17;
}

message UpdateSensorsStateRequest {
  SensorsState sensors_state = 1;
  // Field mask for partial updates. Paths MUST be relative to the resource
  // (e.g., `level_percent`, NOT `sensors_state.level_percent`).
  google.protobuf.FieldMask update_mask = 2;
}
