syntax = "proto3";

package android.control.breadcrumbs;

// Represents a single point-in-time breadcrumb event during the lifecycle of an operation.
//
// Breadcrumbs are used primarily for telemetry, debugging, and post-crash analysis.
// By aggregating `Breadcrumb` messages with the same `flow_id`, engineers can
// reconstruct the exact state machine of an asynchronous operation (like a gRPC call,
// ADB packet transfer, or EventLoop task dispatch) spanning multiple threads, leading
// up to a failure or performance bottleneck.
message Breadcrumb {
  uint64 timestamp_ns = 1;
  uint32 thread_id    = 2;
  uint64 flow_id      = 3;   // Links events across threads

  enum Phase {
    PHASE_UNSPECIFIED = 0;
    INSTANT           = 1;  // A discrete event not part of a larger flow.
    FLOW_BEGIN        = 2;  // Start of a cross-thread operation
    FLOW_STEP         = 3;  // Intermediate step in a flow
    FLOW_END          = 4;  // End of a cross-thread operation
  }
  Phase phase = 4;

  // Polymorphic payload for different use cases
  oneof payload {
    GrpcPayload   grpc   = 5;
    AdbPayload    adb    = 6;
    LooperPayload looper = 7;
  }
}

message GrpcPayload {
  fixed32 method_hash = 1; // CRC32 of method name

  // Detailed gRPC phase to preserve full fidelity of existing system.
  // Note: Enum values are continuous but ordered logically by flow.
  enum GrpcPhase {
    PHASE_UNKNOWN = 0;

    // The very beginning of a call's lifecycle.
    // Server: An incoming request has been detected but not yet parsed.
    // Client: The client is preparing to initiate a new request.
    START = 1;

    // The interceptor is about to send initial metadata to the peer.
    PRE_SEND_INITIAL_METADATA = 2;

    // The interceptor is about to send a message payload.
    // Client: Sending a request message.
    // Server: Sending a response message.
    PRE_SEND_MESSAGE = 3;

    // The message payload has been successfully handed off to the underlying gRPC stack.
    POST_SEND_MESSAGE = 4;

    // Initial metadata has been received from the peer and is ready for inspection.
    PRE_RECV_INITIAL_METADATA = 7;

    // The metadata received hook has completed processing.
    POST_RECV_INITIAL_METADATA = 10;

    // A message has been received from the peer and is ready for inspection.
    PRE_RECV_MESSAGE = 8;

    // The message received hook has completed processing.
    POST_RECV_MESSAGE = 11;

    // The server is preparing to send the final status and trailing metadata.
    PRE_SEND_STATUS = 5;

    // The final status and trailing metadata have been received from the server.
    PRE_RECV_STATUS = 9;

    // The status received hook has completed processing.
    POST_RECV_STATUS = 12;

    // The call is being explicitly closed by the sender (e.g., half-close in streaming).
    PRE_SEND_CLOSE = 6;

    // The call has been marked as closed by the receiver.
    POST_RECV_CLOSE = 13;

    // The call is actively being cancelled by either party.
    PRE_SEND_CANCEL = 14;

    // The terminal state of the RPC. All interceptor operations have completely finished.
    END_OF_CALL = 15;
  }
  GrpcPhase grpc_phase = 2;

  // Standard gRPC status codes
  enum GrpcStatusCode {
    OK                  = 0;
    CANCELLED           = 1;
    UNKNOWN             = 2;
    INVALID_ARGUMENT    = 3;
    DEADLINE_EXCEEDED   = 4;
    NOT_FOUND           = 5;
    ALREADY_EXISTS      = 6;
    PERMISSION_DENIED   = 7;
    RESOURCE_EXHAUSTED  = 8;
    FAILED_PRECONDITION = 9;
    ABORTED             = 10;
    OUT_OF_RANGE        = 11;
    UNIMPLEMENTED       = 12;
    INTERNAL            = 13;
    UNAVAILABLE         = 14;
    DATA_LOSS           = 15;
    UNAUTHENTICATED     = 16;
  }

  oneof detail {
    GrpcStatusCode status_code = 3;
    uint32         msg_size    = 4;
    bytes          payload     = 5;
  }
}

// Payload for ADB (Android Debug Bridge) tracking.
// Captures packet headers and snippets to trace ADB traffic.
message AdbPayload {
  fixed32 command      = 1; // 4-character command packed as little-endian uint32 (e.g., 'CNXN')
  bytes   data_snippet = 2; // Truncated snippet of the payload (e.g., max 32 bytes)

  enum Direction {
    DIRECTIONS_UNSPECIFIED = 0;
    TO_GUEST               = 1;
    TO_HOST                = 2;
  }
  Direction direction = 3;
}

message BreadcrumbList {
  repeated Breadcrumb breadcrumbs = 1;
}

// Payload for EventLoop (looper) asynchronous task tracking.
// Correlates tasks being posted from one thread and executed on another.
message LooperPayload {
  enum LooperEvent {
    EVENT_UNSPECIFIED = 0;
    POST              = 1; // Task was posted to the target event loop queue
    EXECUTE           = 2; // Task started executing on the target event loop
  }
  LooperEvent event     = 1;
  uint64      caller_pc = 2; // Instruction address of the caller (only set for POST)

  // Unique loop ID. Conceptually redundant in looper-local logs since the log buffer
  // itself identifies the looper, but logged as a robust fallback key for reconstructing
  // looper name maps in post-processing tools.
  uint32      loop_id   = 3;

  string      context   = 4; // Optional dynamic context string
}

